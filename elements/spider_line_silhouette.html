<title>Spider-Line Silhouette</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#e4e4e4;
  --ink:#0b0b0c;
  --muted:#56565a;
  --chip:#efefed;
  --line:#b9b9b6;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#101113;--ink:#ecece8;--muted:#a3a3a8;--chip:#1c1d20;--line:#3a3b40;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#101113;--ink:#ecece8;--muted:#a3a3a8;--chip:#1c1d20;--line:#3a3b40;color-scheme:dark}
:root[data-scene="night"]{--bg:#101113;--ink:#ecece8;--muted:#a3a3a8;--chip:#1c1d20;--line:#3a3b40;color-scheme:dark}
:root[data-scene="day"]{--bg:#e4e4e4;--ink:#0b0b0c;--muted:#56565a;--chip:#efefed;--line:#b9b9b6;color-scheme:light}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden}

#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:default;outline:none}
#gl:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}

.ui{position:absolute;left:0;right:0;display:flex;pointer-events:none;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui.top{top:0;justify-content:flex-end;padding-block:12px 0}
.ui.foot{bottom:0;justify-content:center;padding-block:0 14px}

#themeBtn{pointer-events:auto;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;
  min-height:36px;padding:0 14px;cursor:pointer}
#themeBtn:hover{border-color:var(--ink)}
#themeBtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#hint{margin:0;max-width:38ch;text-align:center;font:400 11px/1.55 var(--mono);letter-spacing:.06em;
  color:var(--muted);transition:opacity .8s ease;text-wrap:balance}
#hint.quiet{opacity:.45}
</style>

catch(err){ hint.textContent = 'WebGL is not available in this browser.'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));

var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ------------------------------------------------------------------ palette */
var PAL = {
  day:  {bg1:'#e6e6e6', bg2:'#dfdfdf', ink:'#0b0b0c', win:'#ffffff', halo:'#ffffff', haloA:0.45, speck:'#0b0b0c', speckA:0.18, ring:'#0b0b0c'},
  night:{bg1:'#1a1b1e', bg2:'#0b0c0d', ink:'#ecece8', win:'#1a1b1e', halo:'#ffffff', haloA:0.35, speck:'#ecece8', speckA:0.28, ring:'#ecece8'}
};

var scene = new THREE.Scene();
var camera = new THREE.OrthographicCamera(-250,250,500,-500,-10,10);
camera.position.z = 5;
var viewW = 500, viewH = 1000, upp = 1;

function basic(extra){
  var o = {side:THREE.DoubleSide, depthTest:false, depthWrite:false};
  for(var k in extra) o[k] = extra[k];
  return new THREE.MeshBasicMaterial(o);
}
var inkMat = basic({color:0x0b0b0c});

function mesh(geom, mat, parent, order){
  var m = new THREE.Mesh(geom, mat);
  m.renderOrder = order||0; m.frustumCulled = false;
  if(parent) parent.add(m);
  return m;
}

/* background */
var bgMat = new THREE.ShaderMaterial({
  depthTest:false, depthWrite:false,
  uniforms:{
    c1:{value:new THREE.Color('#e6e6e6')}, c2:{value:new THREE.Color('#dfdfdf')},
    uAsp:{value:0.5}, uLook:{value:new THREE.Vector2(0,0)}, uTime:{value:0}
  },
  vertexShader:'varying vec2 vUv; void main(){ vUv = position.xy*0.5+0.5; gl_Position = vec4(position.xy,0.0,1.0); }',
  fragmentShader:[
    'varying vec2 vUv; uniform vec3 c1; uniform vec3 c2; uniform float uAsp; uniform vec2 uLook; uniform float uTime;',
    'float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }',
    'void main(){',
    '  vec2 p = vUv - 0.5 - uLook*0.025; p.x *= uAsp;',
    '  float d = length(p*vec2(0.85,0.55));',
    '  vec3 col = mix(c1, c2, smoothstep(0.0, 0.95, d));',
    '  col += (h(gl_FragCoord.xy + floor(uTime*24.0)) - 0.5) * 0.012;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n')
});
mesh(new THREE.PlaneGeometry(2,2), bgMat, scene, -10);

/* ------------------------------------------------------------------ sprite shader helper */
var texLoader = new THREE.TextureLoader();
var spriteMats = [];
function makeSpriteMesh(b64, wPx, hPx, axPx, ayPx, scale, parent, order){
  var tex = texLoader.load(b64);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  var mat = new THREE.ShaderMaterial({
    transparent:true, depthTest:false, depthWrite:false, side:THREE.DoubleSide,
    uniforms:{
      uTex:{value:tex},
      uInk:{value:new THREE.Color('#0b0b0c')},
      uWin:{value:new THREE.Color('#ffffff')}
    },
    vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader:[
      'varying vec2 vUv; uniform sampler2D uTex; uniform vec3 uInk; uniform vec3 uWin;',
      'void main(){',
      '  vec4 t = texture2D(uTex, vUv);',
      '  if(t.a < 0.01) discard;',
      '  vec3 col = mix(uInk, uWin, t.r);',
      '  gl_FragColor = vec4(col, t.a);',
      '}'
    ].join('\n')
  });
  spriteMats.push(mat);
  var W = wPx * scale, H = hPx * scale;
  /* Anchor (axPx, ayPx) in image coords (top-left origin) becomes (0,0) in local mesh coords */
  var cx = (wPx * 0.5 - axPx) * scale;
  var cy = (ayPx - hPx * 0.5) * scale;
  var geom = new THREE.PlaneGeometry(W, H);
  geom.translate(cx, cy, 0);
  return mesh(geom, mat, parent, order);
}

/* ------------------------------------------------------------------ web line physics */
var N = 37, SEG = 10.9, G = 2600, DT = 1/120, DAMP = 0.9992, ITER = 32;
var AX = 6, AY = 195;
var px = new Float32Array(N), py = new Float32Array(N), ox = new Float32Array(N), oy = new Float32Array(N), inv = new Float32Array(N);
(function(){
  for(var i=0;i<N;i++){
    var u = i/(N-1);
    px[i] = AX + 10*u*u; py[i] = AY - i*SEG;
    ox[i] = px[i]; oy[i] = py[i]; inv[i] = 1;
  }
})();
var dragIdx = -1, dragTX = 0, dragTY = 0, dragCX = 0, dragCY = 0;
var LM = 4.8, CM = 3.2;

/* Spider-Man climber state (starts at exact reference position ~26.5% down the web line) */
var climbS = 9.6, climbDir = -1, climbPhase = 0, climbSpeed = reduce ? 0 : 0.22;
var SMIN = 7.2, SMAX = 15.5;
var bodyAng = 0, bodyVel = 0, gpX = 0, gpY = 0, gpPX = 0, gpPY = 0, gpVX = 0;
/* Gwen state at bottom of web line */
var lanAng = 0, lanVel = 0, lanHX = 0, lanPHX = 0, flare = 0;
/* Top Spider-Eye + Web Emblem state */
var EMB_R = 68, eAng = 0, eVel = 0;
var calm = 1, avgSpeed = 0;

function wind(t){ return (Math.sin(t*0.63)*38 + Math.sin(t*1.71+1.3)*22) * (reduce ? 0.2 : 1); }

function setMasses(){
  var i;
  for(i=0;i<N;i++) inv[i] = 1;
  inv[N-1] = 1/LM;
  var i0 = Math.floor(climbS), f = climbS - i0;
  inv[i0] = 1/(1 + CM*(1-f));
  inv[i0+1] = 1/(1 + CM*f);
  inv[0] = 0;
  if(dragIdx > 0) inv[dragIdx] = 0;
}

function solve(a,b){
  var dx = px[b]-px[a], dy = py[b]-py[a];
  var d = Math.sqrt(dx*dx+dy*dy) || 1e-6;
  var diff = (d-SEG)/d;
  var wa = inv[a], wb = inv[b], ws = wa+wb;
  if(ws === 0) return;
  var ca = wa/ws*diff, cb = wb/ws*diff;
  px[a] += dx*ca; py[a] += dy*ca;
  px[b] -= dx*cb; py[b] -= dy*cb;
}

function step(dt, t){
  var dt2 = dt*dt, i, wx = wind(t);
  for(i=1;i<N;i++){
    if(i === dragIdx) continue;
    var vx = (px[i]-ox[i])*DAMP, vy = (py[i]-oy[i])*DAMP;
    ox[i] = px[i]; oy[i] = py[i];
    px[i] += vx + wx*dt2*inv[i];
    py[i] += vy - G*dt2;
  }
  if(dragIdx > 0){
    var j = dragIdx;
    dragCX += (dragTX-dragCX)*0.4; dragCY += (dragTY-dragCY)*0.4;
    ox[j] = px[j]; oy[j] = py[j]; px[j] = dragCX; py[j] = dragCY;
  }
  px[0] = AX; py[0] = AY; ox[0] = AX; oy[0] = AY;
  for(var it=0; it<ITER; it++){
    if(it&1){ for(i=N-2;i>=0;i--) solve(i,i+1); }
    else { for(i=0;i<N-1;i++) solve(i,i+1); }
  }
}

/* ------------------------------------------------------------------ braided spider-web line meshes */
var SUB = 4, RN = (N-1)*SUB + 1;
function makeRibbon(n){
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*6), 3));
  var idx = [];
  for(var i=0;i<n-1;i++){ var a = i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  g.setIndex(idx);
  return g;
}
function updateRibbon(geom, xs, ys, n, wfn, offsetFn){
  var pos = geom.attributes.position.array;
  for(var i=0;i<n;i++){
    var a = i>0 ? i-1 : 0, b = i<n-1 ? i+1 : n-1;
    var tx = xs[b]-xs[a], ty = ys[b]-ys[a], l = Math.sqrt(tx*tx+ty*ty) || 1;
    tx /= l; ty /= l;
    var u = i/(n-1);
    var w = wfn(u)*0.5;
    var off = offsetFn ? offsetFn(u) : 0;
    var ox2 = -ty*off, oy2 = tx*off;
    var nx = -ty*w, ny = tx*w, k = i*6;
    pos[k]   = xs[i]+ox2+nx; pos[k+1] = ys[i]+oy2+ny; pos[k+2] = 0;
    pos[k+3] = xs[i]+ox2-nx; pos[k+4] = ys[i]+oy2-ny; pos[k+5] = 0;
  }
  geom.attributes.position.needsUpdate = true;
}
function catmull(xs, ys, n, sub, outX, outY){
  var k = 0;
  for(var i=0;i<n-1;i++){
    var i0 = i>0 ? i-1 : 0, i3 = i+2<n ? i+2 : n-1;
    for(var s=0;s<sub;s++){
      var t = s/sub, t2 = t*t, t3 = t2*t;
      outX[k] = 0.5*((2*xs[i]) + (-xs[i0]+xs[i+1])*t + (2*xs[i0]-5*xs[i]+4*xs[i+1]-xs[i3])*t2 + (-xs[i0]+3*xs[i]-3*xs[i+1]+xs[i3])*t3);
      outY[k] = 0.5*((2*ys[i]) + (-ys[i0]+ys[i+1])*t + (2*ys[i0]-5*ys[i]+4*ys[i+1]-ys[i3])*t2 + (-ys[i0]+3*ys[i]-3*ys[i+1]+ys[i3])*t3);
      k++;
    }
  }
  outX[k] = xs[n-1]; outY[k] = ys[n-1];
  return k+1;
}

/* Main taut web line + secondary organic braided tendril strand */
var ropeGeom = makeRibbon(RN);
mesh(ropeGeom, inkMat, scene, 7);
var tendrilGeom = makeRibbon(RN);
mesh(tendrilGeom, inkMat, scene, 3);
var ropeX = new Float32Array(RN), ropeY = new Float32Array(RN);

/* ------------------------------------------------------------------ 1. Top Spider-Eye + Cobweb Emblem */
var emblem = new THREE.Group();
emblem.position.set(AX, AY, 0);
scene.add(emblem);
var lattice = new THREE.Group();
emblem.add(lattice);
makeSpriteMesh(EMB_B64, 192, 179, 111, 178, SC, lattice, 5);

/* ------------------------------------------------------------------ 2. Spider-Man Climber (Curve-Skinned to Rope so Hands Never Leave Rope) */
var SPIDEY_ROWS = 28;
var SPIDEY_W = 84 * SC, SPIDEY_H = 194 * SC;
var SPIDEY_SPAN = SPIDEY_H / SEG; /* Exact number of rope segments between top hand & bottom hand */

var spideyTex = texLoader.load(SPIDEY_B64);
spideyTex.minFilter = THREE.LinearFilter;
spideyTex.magFilter = THREE.LinearFilter;
var spideyMat = new THREE.ShaderMaterial({
  transparent:true, depthTest:false, depthWrite:false, side:THREE.DoubleSide,
  uniforms:{
    uTex:{value:spideyTex},
    uInk:{value:new THREE.Color('#0b0b0c')},
    uWin:{value:new THREE.Color('#ffffff')}
  },
  vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader:[
    'varying vec2 vUv; uniform sampler2D uTex; uniform vec3 uInk; uniform vec3 uWin;',
    'void main(){',
    '  vec4 t = texture2D(uTex, vUv);',
    '  if(t.a < 0.01) discard;',
    '  vec3 col = mix(uInk, uWin, t.r);',
    '  gl_FragColor = vec4(col, t.a);',
    '}'
  ].join('\n')
});
spriteMats.push(spideyMat);

var spideyGeom = (function(){
  var g = new THREE.BufferGeometry();
  var pos = new Float32Array(SPIDEY_ROWS * 2 * 3);
  var uvs = new Float32Array(SPIDEY_ROWS * 2 * 2);
  var idx = [];
  for(var r=0; r<SPIDEY_ROWS; r++){
    var v = 1.0 - r / (SPIDEY_ROWS - 1); /* v=1 at top (upper hand), v=0 at bottom (lower hand) */
    uvs[r*4 + 0] = 0.0; uvs[r*4 + 1] = v;
    uvs[r*4 + 2] = 1.0; uvs[r*4 + 3] = v;
    if(r < SPIDEY_ROWS - 1){
      var a = r * 2;
      idx.push(a, a+1, a+2, a+1, a+3, a+2);
    }
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
})();
mesh(spideyGeom, spideyMat, scene, 6);

/* Upper & Lower Hand Grip Wraps locked directly onto the rope at Spider-Man's fists */
var gripTop = mesh(new THREE.CircleGeometry(3.2, 16), inkMat, scene, 8);
var gripBot = mesh(new THREE.CircleGeometry(2.8, 16), inkMat, scene, 8);

function updateSpideyOnRope(centerS, phase){
  var pos = spideyGeom.attributes.position.array;
  var halfSpan = SPIDEY_SPAN * 0.5;
  var pA = [0,0], pB = [0,0], pM = [0,0];

  /* Overall chord direction between upper hand and lower hand for torso stability */
  samp(centerS - halfSpan, pA);
  samp(centerS + halfSpan, pB);
  var cdx = pB[0] - pA[0], cdy = pB[1] - pA[1];
  var clen = Math.sqrt(cdx*cdx + cdy*cdy) || 1;
  var chordNx = -cdy / clen, chordNy = cdx / clen; /* points right of the downward rope */

  for(var r=0; r<SPIDEY_ROWS; r++){
    var uCrop = r / (SPIDEY_ROWS - 1); /* 0 at top (y=434), 1 at bottom (y=628) */
    var s = centerS + (uCrop - 0.5) * SPIDEY_SPAN;
    samp(s, pM);

    /* Local rope tangent at slice s */
    var s0 = Math.max(0, s - 0.6), s1 = Math.min(N - 1.001, s + 0.6);
    samp(s0, pA); samp(s1, pB);
    var tx = pB[0] - pA[0], ty = pB[1] - pA[1];
    var tl = Math.sqrt(tx*tx + ty*ty) || 1;
    var locNx = -ty / tl, locNy = tx / tl;

    /* Blend normal: hands at top/bottom follow local rope normal; torso/legs use stable chord normal */
    var handWeight = Math.pow(Math.abs(uCrop - 0.5) * 2.0, 1.6);
    var nx = chordNx * (1 - 0.5*handWeight) + locNx * (0.5*handWeight);
    var ny = chordNy * (1 - 0.5*handWeight) + locNy * (0.5*handWeight);
    var nl = Math.sqrt(nx*nx + ny*ny) || 1;
    nx /= nl; ny /= nl;

    /* Exact pixel anchor of the rope inside Spider-Man's crop:
       Top hand (uCrop=0.04) is at x=21.5px; lower hand (uCrop=0.91) is at x=25.0px */
    var axPx = 21.4 + 3.8 * uCrop;
    /* Subtle climbing leg/body breathing sway that vanishes at the two hands so hands stay 100% locked on rope */
    var midMask = Math.sin(uCrop * Math.PI);
    var climbSway = Math.sin(phase) * 1.4 * midMask * midMask;

    var leftDist  = -axPx * SC + climbSway;
    var rightDist = (84.0 - axPx) * SC + climbSway;

    var k = r * 6;
    pos[k + 0] = pM[0] + nx * leftDist;
    pos[k + 1] = pM[1] + ny * leftDist;
    pos[k + 2] = 0;

    pos[k + 3] = pM[0] + nx * rightDist;
    pos[k + 4] = pM[1] + ny * rightDist;
    pos[k + 5] = 0;

    if(r === 1){
      gripTop.position.set(pM[0], pM[1], 0);
    } else if(r === 25){
      gripBot.position.set(pM[0], pM[1], 0);
    }
  }
  spideyGeom.attributes.position.needsUpdate = true;
}

/* ------------------------------------------------------------------ 3. Gwen Stacy + Web-Catch Fan */
var lantern = new THREE.Group();
scene.add(lantern);
var haloMat = new THREE.ShaderMaterial({
  transparent:true, depthTest:false, depthWrite:false,
  uniforms:{uColor:{value:new THREE.Color('#ffffff')}, uA:{value:0.45}},
  vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'varying vec2 vUv; uniform vec3 uColor; uniform float uA; void main(){ float d = length(vUv-0.5)*2.0; float a = pow(clamp(1.0-d,0.0,1.0), 2.2)*uA; gl_FragColor = vec4(uColor, a); }'
});
var halo = mesh(new THREE.PlaneGeometry(1,1), haloMat, lantern, 1);
halo.position.set(6, -64, 0); halo.scale.set(240, 240, 1);
makeSpriteMesh(GWEN_B64, 162, 166, 71, 2, SC, lantern, 7);

/* ------------------------------------------------------------------ ripples + dust */
var ripples = [];
(function(){
  for(var i=0;i<4;i++){
    var m = new THREE.Mesh(new THREE.RingGeometry(0.97, 1, 64), new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0, depthTest:false, depthWrite:false, side:THREE.DoubleSide}));
    m.visible = false; m.renderOrder = 10; m.frustumCulled = false; scene.add(m);
    ripples.push({m:m, on:false, t:0, R:200});
  }
})();
function ripple(x, y, R){
  var r = null, i;
  for(i=0;i<ripples.length;i++){ if(!ripples[i].on){ r = ripples[i]; break; } }
  if(!r) r = ripples[0];
  r.on = true; r.t = 0; r.R = R; r.m.position.set(x, y, 0); r.m.visible = true;
}

var SPN = 55;
var spBX = new Float32Array(SPN), spBY = new Float32Array(SPN), spD = new Float32Array(SPN), spP = new Float32Array(SPN), spVX = new Float32Array(SPN), spVY = new Float32Array(SPN);
var spGeom = new THREE.BufferGeometry();
spGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SPN*3), 3));
var spMat = new THREE.PointsMaterial({color:0x000000, size:2.2, sizeAttenuation:false, transparent:true, opacity:0.18, depthTest:false, depthWrite:false});
var specks = new THREE.Points(spGeom, spMat); specks.renderOrder = 2; specks.frustumCulled = false; scene.add(specks);
function seedSpecks(){
  for(var i=0;i<SPN;i++){
    spBX[i] = (Math.random()-0.5)*(viewW+80); spBY[i] = (Math.random()-0.5)*(viewH+80);
    spD[i] = 0.25 + Math.random()*0.75; spP[i] = Math.random()*6.28; spVX[i] = 0; spVY[i] = 0;
  }
}

/* ------------------------------------------------------------------ theme (defaults to Day #e4e4e4 matching image) */
var sceneName = 'day', userPicked = false;
function applyScene(name){
  sceneName = name;
  var P = PAL[name];
  bgMat.uniforms.c1.value.set(P.bg1); bgMat.uniforms.c2.value.set(P.bg2);
  inkMat.color.set(P.ink);
  for(var s=0;s<spriteMats.length;s++){
    spriteMats[s].uniforms.uInk.value.set(P.ink);
    spriteMats[s].uniforms.uWin.value.set(P.win);
  }
  haloMat.uniforms.uColor.value.set(P.halo);
  spMat.color.set(P.speck); spMat.opacity = P.speckA;
  for(var i=0;i<ripples.length;i++) ripples[i].m.material.color.set(P.ring);
  root.setAttribute('data-scene', name);
  btn.textContent = name === 'day' ? 'Night' : 'Day';
  btn.setAttribute('aria-pressed', name === 'night' ? 'true' : 'false');
}
btn.addEventListener('click', function(){ userPicked = true; applyScene(sceneName === 'day' ? 'night' : 'day'); });
applyScene('day');

/* ------------------------------------------------------------------ resize */
function resize(){
  var r = stage.getBoundingClientRect();
  var w = Math.max(1, r.width), h = Math.max(1, r.height), asp = w/h;
  renderer.setSize(w, h, false);
  viewH = Math.max(820, 420/asp); viewW = viewH*asp; upp = viewH/h;
  camera.left = -viewW/2; camera.right = viewW/2; camera.top = viewH/2; camera.bottom = -viewH/2;
  camera.updateProjectionMatrix();
  bgMat.uniforms.uAsp.value = asp;
  seedSpecks();
}
resize();
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ helpers for picking */
function samp(s, out){
  var i = Math.max(0, Math.min(N-2, Math.floor(s))), f = Math.max(0, Math.min(1, s - i));
  out[0] = px[i] + (px[i+1]-px[i])*f; out[1] = py[i] + (py[i+1]-py[i])*f;
}
var tmpA = [0,0], tmpB = [0,0];
function lanternCenter(){
  var ang = lanAng;
  return [lanHX + Math.sin(ang)*55, py[N-1] - Math.cos(ang)*55];
}
function climberCenter(){
  var c = Math.cos(bodyAng), s = Math.sin(bodyAng), lx = 14, ly = 0;
  return [gpX + lx*c - ly*s, gpY + lx*s + ly*c];
}
function toWorld(e){
  var r = canvas.getBoundingClientRect();
  return {
    x: camera.position.x + ((e.clientX - r.left)/r.width - 0.5)*viewW,
    y: camera.position.y + (0.5 - (e.clientY - r.top)/r.height)*viewH
  };
}
function dist(ax, ay, bx, by){ var dx = ax-bx, dy = ay-by; return Math.sqrt(dx*dx+dy*dy); }
function pick(w){
  var lc = lanternCenter();
  if(dist(w.x, w.y, lc[0], lc[1]) < Math.max(68, 40*upp)) return {type:'lantern', idx:N-1};
  var cc = climberCenter();
  if(dist(w.x, w.y, cc[0], cc[1]) < Math.max(64, 38*upp)) return {type:'climber', idx:Math.max(1, Math.min(N-2, Math.round(climbS)))};
  if(dist(w.x, w.y, AX - 10, AY + 70) < EMB_R + 12) return {type:'emblem', idx:-1};
  var best = -1, bd = Math.max(30, 26*upp);
  for(var i=1;i<N;i++){
    var d = dist(w.x, w.y, px[i], py[i]);
    if(d < bd){ bd = d; best = i; }
  }
  if(best > 0) return {type:'rope', idx:best};
  return {type:'sky', idx:-1};
}
function clampReach(idx, x, y){
  var dx = x-AX, dy = y-AY, d = Math.sqrt(dx*dx+dy*dy), md = idx*SEG*0.996;
  if(d > md){ x = AX + dx/d*md; y = AY + dy/d*md; }
  return [x, y];
}

/* ------------------------------------------------------------------ reactions */
function gust(x, y, power){
  var i, dx, dy, d, s;
  for(i=1;i<N;i++){
    dx = px[i]-x; dy = py[i]-y; d = Math.sqrt(dx*dx+dy*dy) || 1;
    if(d < 280){ s = Math.pow(1-d/280, 2)*power*inv[i]; ox[i] -= dx/d*s; oy[i] -= dy/d*s; }
  }
  for(i=0;i<SPN;i++){
    dx = spBX[i]-x; dy = spBY[i]-y; d = Math.sqrt(dx*dx+dy*dy) || 1;
    if(d < 360){ s = (1-d/360)*power*90*spD[i]; spVX[i] += dx/d*s; spVY[i] += dy/d*s; }
  }
  ripple(x, y, 220);
}
function kickAll(dir, amt){
  for(var i=1;i<N;i++){ if(i !== dragIdx) ox[i] -= dir*amt*Math.pow(i/(N-1), 1.3)*inv[i]; }
  for(var k=0;k<SPN;k++) spVX[k] += dir*amt*60*spD[k];
}
function spinEmblem(dir){ eVel += dir*3.2; ripple(AX-10, AY+68, 130); for(var i=1;i<8;i++) ox[i] -= dir*2.2; }
function reverseClimb(){ climbDir = -climbDir; var i = Math.round(climbS); if(i>0 && i<N-1){ ox[i] -= 1.8*(Math.random()<0.5?1:-1); } bodyVel += (Math.random()-0.5)*3; }

/* ------------------------------------------------------------------ input */
var drag = null, ptr = {x:0, y:0, has:false}, lookX = 0, lookY = 0, lookTX = 0, lookTY = 0;
function noteLook(e){
  var r = canvas.getBoundingClientRect();
  lookTX = ((e.clientX - r.left)/r.width - 0.5)*2; lookTY = (0.5 - (e.clientY - r.top)/r.height)*2;
}
function quietHint(){ hint.classList.add('quiet'); }
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
canvas.addEventListener('pointerdown', function(e){
  if(drag) return;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  noteLook(e);
  var w = toWorld(e), hit = pick(w);
  quietHint();
  if(hit.type === 'sky'){ gust(w.x, w.y, 3.2); return; }
  if(hit.type === 'emblem'){ spinEmblem(w.x > AX ? -1 : 1); return; }
  var c = clampReach(hit.idx, w.x, w.y);
  drag = {id:e.pointerId, idx:hit.idx, type:hit.type, t:performance.now(), sx:e.clientX, sy:e.clientY, moved:0};
  dragIdx = hit.idx; dragCX = px[dragIdx]; dragCY = py[dragIdx]; dragTX = c[0]; dragTY = c[1];
  canvas.style.cursor = 'grabbing';
  e.preventDefault();
});
canvas.addEventListener('pointermove', function(e){
  noteLook(e);
  var w = toWorld(e);
  if(drag && e.pointerId === drag.id){
    var c = clampReach(drag.idx, w.x, w.y);
    dragTX = c[0]; dragTY = c[1];
    drag.moved = Math.max(drag.moved, dist(e.clientX, e.clientY, drag.sx, drag.sy));
    return;
  }
  if(e.pointerType === 'mouse'){
    if(ptr.has){
      var dx = Math.max(-30, Math.min(30, w.x-ptr.x)), dy = Math.max(-30, Math.min(30, w.y-ptr.y));
      for(var i=1;i<N;i++){
        var d = dist(px[i], py[i], w.x, w.y);
        if(d < 36 && inv[i] > 0){ var s = (1-d/36)*0.5; px[i] += dx*s; py[i] += dy*s; }
      }
    }
    var h = pick(w);
    canvas.style.cursor = h.type === 'sky' ? 'default' : (h.type === 'emblem' ? 'pointer' : 'grab');
  }
  ptr.x = w.x; ptr.y = w.y; ptr.has = true;
});
function release(e){
  if(!drag || e.pointerId !== drag.id) return;
  var i = dragIdx, vx = px[i]-ox[i], vy = py[i]-oy[i], m = Math.sqrt(vx*vx+vy*vy);
  if(m > 9){ ox[i] = px[i] - vx/m*9; oy[i] = py[i] - vy/m*9; }
  var tap = (performance.now() - drag.t) < 320 && drag.moved < 9;
  if(tap){
    if(drag.type === 'climber') reverseClimb();
    if(drag.type === 'lantern'){ flare = 1; ox[N-1] -= (Math.random()<0.5?-1:1)*2.2; }
  }
  dragIdx = -1; drag = null;
  canvas.style.cursor = 'default';
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', function(){ ptr.has = false; });
canvas.addEventListener('keydown', function(e){
  if(e.key === 'ArrowLeft'){ kickAll(-1, 2.4); quietHint(); e.preventDefault(); }
  else if(e.key === 'ArrowRight'){ kickAll(1, 2.4); quietHint(); e.preventDefault(); }
  else if(e.key === ' ' || e.key === 'Enter'){ reverseClimb(); quietHint(); e.preventDefault(); }
});

/* ------------------------------------------------------------------ frame */
var acc = 0, simT = 0, last = performance.now(), clock = 0;
var wfRope = function(u){ return 1.85 - 0.25*u; };
var wfTendril = function(u){
  /* Organic braided web strand thickness matching the reference drawing */
  return 1.15 * Math.sin(u * Math.PI);
};
var offTendril = function(u){
  return Math.sin(u * 38.0) * (1.8 * Math.sin(u * Math.PI));
};

function frame(now){
  requestAnimationFrame(frame);
  var dt = Math.min((now - last)/1000, 1/20); last = now;
  if(dt <= 0) return;
  clock += dt;

  calm = Math.max(0, Math.min(1, 1.6 - avgSpeed/110));
  if(dragIdx > 0) calm = 0;
  var edge = Math.max(0.15, Math.min(1, Math.min(climbS - SMIN, SMAX - climbS)/1.5));
  var ds = climbDir*climbSpeed*dt*calm*edge;
  climbS += ds;
  if(climbS < SMIN){ climbS = SMIN; climbDir = 1; }
  if(climbS > SMAX){ climbS = SMAX; climbDir = -1; }
  climbPhase += -ds*2.6;

  setMasses();
  acc += dt;
  while(acc >= DT){ simT += DT; step(DT, simT); acc -= DT; }

  var i, sum = 0;
  for(i=1;i<N;i++){ var vx = px[i]-ox[i], vy = py[i]-oy[i]; sum += Math.sqrt(vx*vx+vy*vy); }
  avgSpeed = sum/(N-1)/DT;

  /* web line & braided tendril */
  var n = catmull(px, py, N, SUB, ropeX, ropeY);
  updateRibbon(ropeGeom, ropeX, ropeY, n, wfRope, null);
  updateRibbon(tendrilGeom, ropeX, ropeY, n, wfTendril, offTendril);

  /* Spider-Man curve-skinned directly onto the live Verlet rope so both hands hold the rope tightly */
  samp(climbS, tmpA); gpPX = gpX; gpPY = gpY; gpX = tmpA[0]; gpY = tmpA[1];
  gpVX = (gpX - gpPX)/dt;
  samp(climbS - 3.2, tmpA); samp(climbS + 3.2, tmpB);
  var ux = tmpA[0]-tmpB[0], uy = tmpA[1]-tmpB[1];
  bodyAng = Math.atan2(-ux, uy);
  updateSpideyOnRope(climbS, climbPhase);

  /* Gwen Stacy transform at bottom of the web line */
  lanPHX = lanHX; lanHX = px[N-1];
  var ldx = px[N-1]-px[N-4], ldy = py[N-1]-py[N-4];
  var lt = Math.atan2(ldx, -ldy) - Math.max(-0.4, Math.min(0.4, (lanHX-lanPHX)/dt*0.0012));
  lanVel += (55*(lt - lanAng) - 3.6*lanVel)*dt;
  lanAng += lanVel*dt;
  lantern.position.set(px[N-1], py[N-1], 0);
  lantern.rotation.z = lanAng;
  var flick = 0.5 + 0.5*Math.sin(clock*6);
  flare = Math.max(flare - dt*1.4, Math.min(1, Math.abs(lanVel)*0.12));
  haloMat.uniforms.uA.value = PAL[sceneName].haloA*(0.82 + 0.1*flick + 0.25*flare);

  /* Top Spider-Eye + Web Emblem elastic tilt with rope tension */
  var tilt = Math.max(-0.14, Math.min(0.14, (px[3]-AX)*0.0045));
  eVel += (38*(tilt - eAng) - 3.2*eVel)*dt;
  eAng += eVel*dt;
  lattice.rotation.z = eAng;

  /* ripples */
  for(i=0;i<ripples.length;i++){
    var r = ripples[i];
    if(!r.on) continue;
    r.t += dt/0.85;
    if(r.t >= 1){ r.on = false; r.m.visible = false; continue; }
    var e1 = 1 - Math.pow(1 - r.t, 3), sc = Math.max(1, r.R*e1);
    r.m.scale.set(sc, sc, 1);
    r.m.material.opacity = 0.38*(1 - r.t);
  }

  /* dust */
  var sp = spGeom.attributes.position.array, hx = viewW/2 + 40, hy = viewH/2 + 40;
  for(i=0;i<SPN;i++){
    spVX[i] *= 0.965; spVY[i] *= 0.965;
    spBX[i] += spVX[i]*dt;
    spBY[i] += (spVY[i]*dt*0.9 + (reduce ? 0 : 5*spD[i]*dt));
    if(spBY[i] > hy) spBY[i] = -hy; if(spBY[i] < -hy) spBY[i] = hy;
    if(spBX[i] > hx) spBX[i] = -hx; if(spBX[i] < -hx) spBX[i] = hx;
    var wob = reduce ? 0 : Math.sin(clock*0.35 + spP[i])*9*spD[i];
    sp[i*3] = spBX[i] + wob - lookX*34*(spD[i]-0.4);
    sp[i*3+1] = spBY[i] + Math.cos(clock*0.28 + spP[i]*1.7)*5*spD[i] - lookY*20*(spD[i]-0.4);
    sp[i*3+2] = 0;
  }
  spGeom.attributes.position.needsUpdate = true;

  /* camera parallax */
  lookX += (lookTX - lookX)*Math.min(1, dt*3); lookY += (lookTY - lookY)*Math.min(1, dt*3);
  camera.position.x = lookX*9; camera.position.y = lookY*6;
  bgMat.uniforms.uLook.value.set(lookX, lookY);
  bgMat.uniforms.uTime.value = clock;

  renderer.render(scene, camera);
}

requestAnimationFrame(function(t){ last = t; frame(t); });
})();
</script>
</body></html>
