<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive 3D Spider-Luffy Live Portrait</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121318;
      --silhouette-color: #050507;
      --suit-color: #c43d4c;
      --eye-color: #ff6b35;
      --aura-color: #ffd166;
      --rim-opacity: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background-color 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: crosshair;
    }

    /* Optional Dot-Matrix Halftone Backdrop Mode */
    body.mode-halftone::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.22) 1.5px, transparent 1.5px);
      background-size: 14px 14px;
      pointer-events: none;
      z-index: 2;
    }

    /* Three.js WebGL Ambient Particle & Aura Canvas */
    #webgl-aura {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Interactive 2D FX Canvas (Haki Lightning, Spider-Sense Ripples & Web Strands) */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 20;
    }

    /* Compact Framed Portrait Card Stage */
    .portrait-stage {
      position: relative;
      z-index: 10;
      width: min(410px, 84vw, 78vh);
      height: min(410px, 84vw, 78vh);
      border-radius: 34px;
      background-color: var(--bg-color);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 28px 64px -12px rgba(0, 0, 0, 0.68),
        0 0 42px -8px rgba(255, 209, 102, 0.16),
        inset 0 1px 2px rgba(255, 255, 255, 0.15);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      perspective: 1200px;
      transition: background-color 0.45s ease, transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease;
    }

    .character-rig {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: center bottom;
      transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
      position: relative;
    }

    #character-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.28));
      transition: filter 0.3s ease;
    }

    body.mode-overdrive #character-svg {
      filter:
        drop-shadow(0 0 22px var(--aura-color))
        drop-shadow(0 18px 38px rgba(0, 0, 0, 0.45));
    }

    /* Base Black Silhouette */
    #base-silhouette {
      fill: var(--silhouette-color);
      transition: fill 0.35s ease;
    }

    /* 24 Interactive Spider-Suit Web Cells */
    .suit-cell {
      fill: var(--suit-color);
      transition: fill 0.28s ease, filter 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .suit-cell:hover {
      filter: brightness(1.28) drop-shadow(0 0 8px var(--suit-color));
    }

    .suit-cell.pulse-cell {
      filter: brightness(1.55) drop-shadow(0 0 14px var(--eye-color));
    }

    /* Interactive Eyes & Scar Group */
    #eyes-scar-rig {
      transition: transform 0.07s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
    }

    .eye-shape {
      fill: var(--eye-color);
      transition: fill 0.3s ease, filter 0.25s ease, transform 0.14s cubic-bezier(0.22, 1, 0.36, 1);
      transform-box: fill-box;
      transform-origin: center bottom;
      cursor: pointer;
    }

    #scar-shape {
      fill: var(--eye-color);
      transition: fill 0.3s ease, filter 0.25s ease, transform 0.14s ease;
      transform-box: fill-box;
      transform-origin: center center;
    }

    body.mode-overdrive .eye-shape,
    .character-rig.haki-active .eye-shape {
      filter: drop-shadow(0 0 16px var(--eye-color)) drop-shadow(0 0 30px var(--aura-color));
    }

    body.mode-overdrive #scar-shape,
    .character-rig.haki-active #scar-shape {
      filter: drop-shadow(0 0 10px var(--eye-color));
    }

    /* Eye Blinking & Squinting States */
    .eye-blink {
      transform: scaleY(0.05) !important;
    }

    .eye-squint {
      transform: scaleY(0.58) scaleX(1.04) !important;
    }

    .eye-wide {
      transform: scaleY(1.16) scaleX(1.05) !important;
    }

    /* =====================================================================
       UNIQUE MORPHING 3x3 DOT-MATRIX GLYPH HAMBURGER LAUNCHER
       ===================================================================== */
    .glyph-launcher {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 100;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: #0c0c0e;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
      display: grid;
      grid-template-columns: repeat(3, 6px);
      grid-template-rows: repeat(3, 6px);
      gap: 5px;
      align-content: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-radius 0.3s ease;
    }

    .glyph-launcher:hover {
      transform: scale(1.08);
    }

    .glyph-launcher.open {
      border-radius: 50%;
      transform: rotate(90deg) scale(1.05);
    }

    .glyph-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--eye-color);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, background-color 0.25s ease;
    }

    .glyph-dot:nth-child(5) {
      background-color: var(--suit-color);
      box-shadow: 0 0 8px var(--suit-color);
    }

    .glyph-launcher:hover .glyph-dot:nth-child(2),
    .glyph-launcher:hover .glyph-dot:nth-child(4),
    .glyph-launcher:hover .glyph-dot:nth-child(6),
    .glyph-launcher:hover .glyph-dot:nth-child(8) {
      opacity: 0.35;
      transform: scale(0.75);
    }

    .glyph-launcher.open .glyph-dot:nth-child(2),
    .glyph-launcher.open .glyph-dot:nth-child(4),
    .glyph-launcher.open .glyph-dot:nth-child(6),
    .glyph-launcher.open .glyph-dot:nth-child(8) {
      opacity: 0;
      transform: scale(0);
    }

    .glyph-launcher.open .glyph-dot:nth-child(1) { transform: translate(3px, 3px); }
    .glyph-launcher.open .glyph-dot:nth-child(3) { transform: translate(-3px, 3px); }
    .glyph-launcher.open .glyph-dot:nth-child(7) { transform: translate(3px, -3px); }
    .glyph-launcher.open .glyph-dot:nth-child(9) { transform: translate(-3px, -3px); }

    /* =====================================================================
       CUSTOMIZER POD (Strictly 5 Colors per Category + 4 Interactive Modes)
       ===================================================================== */
    .customizer-pod {
      position: fixed;
      top: 80px;
      right: 22px;
      z-index: 99;
      width: 244px;
      background: rgba(12, 12, 15, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-12px) scale(0.95);
      transform-origin: top right;
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .customizer-pod.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .swatch-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .color-swatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease;
    }

    .color-swatch:hover {
      transform: scale(1.12);
    }

    .color-swatch.selected {
      border-color: #ffffff;
      transform: scale(1.14);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.22);
    }

    .mode-chip {
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #a1a1aa;
    }

    .mode-chip:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    .mode-chip.selected {
      background: #ffffff;
      color: #0c0c0e;
      border-color: #ffffff;
    }
  </style>
</head>
<body class="mode-overdrive">

  <!-- 1. Three.js WebGL Ambient 3D Particles & Aura Canvas -->
  <canvas id="webgl-aura"></canvas>

  <!-- 2. High-FPS 2D Interactive FX Canvas (Haki Lightning, Web Strands & Spider-Sense) -->
  <canvas id="fx-canvas"></canvas>

  <!-- 3. Unique 3x3 Dot-Matrix Glyph Hamburger Launcher -->
  <button type="button" class="glyph-launcher" id="glyph-hamburger" aria-label="Customize Character & UI">
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
  </button>

  <!-- 4. Customizer Pod (Strictly 5 Curated Colors per Category + 4 Interactive Modes) -->
  <div class="customizer-pod" id="customizer-pod">
    <!-- BG Colors (5 Limit) -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] tracking-[0.14em] uppercase text-[#8a8a90] font-medium">BG</span>
        <span class="w-1.5 h-1.5 rounded-full bg-[#c43d4c]"></span>
      </div>
      <div class="swatch-row" id="bg-swatches">
        <button type="button" class="color-swatch" data-bg="#767d83" style="background: #767d83;" title="Original Slate Grey"></button>
        <button type="button" class="color-swatch selected" data-bg="#121318" style="background: #121318;" title="Obsidian Dark"></button>
        <button type="button" class="color-swatch" data-bg="#280d12" style="background: #280d12;" title="Crimson Night"></button>
        <button type="button" class="color-swatch" data-bg="#0f172a" style="background: #0f172a;" title="Cyber Blueprint"></button>
        <button type="button" class="color-swatch" data-bg="#d6d3cd" style="background: #d6d3cd;" title="Warm Alabaster"></button>
      </div>
    </div>

    <!-- Suit Web Cell Colors (5 Limit) -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] tracking-[0.14em] uppercase text-[#8a8a90] font-medium">SUIT</span>
        <span class="w-1.5 h-1.5 rounded-full bg-white/40"></span>
      </div>
      <div class="swatch-row" id="suit-swatches">
        <button type="button" class="color-swatch selected" data-suit="#c43d4c" style="background: #c43d4c;" title="Classic Spider Red"></button>
        <button type="button" class="color-swatch" data-suit="#7c3aed" style="background: #7c3aed;" title="Symbiote Violet"></button>
        <button type="button" class="color-swatch" data-suit="#0284c7" style="background: #0284c7;" title="Cyber Spider Cyan"></button>
        <button type="button" class="color-swatch" data-suit="#10b981" style="background: #10b981;" title="Venom Emerald"></button>
        <button type="button" class="color-swatch" data-suit="#eab308" style="background: #eab308;" title="Imperium Gold"></button>
      </div>
    </div>

    <!-- Eyes & Scar Glow Colors (5 Limit) -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] tracking-[0.14em] uppercase text-[#8a8a90] font-medium">EYES</span>
        <span class="w-1.5 h-1.5 rounded-full bg-white"></span>
      </div>
      <div class="swatch-row" id="eye-swatches">
        <button type="button" class="color-swatch" data-eye="#ffffff" data-aura="#ff2e43" style="background: linear-gradient(135deg, #ffffff 55%, #ff2e43 55%);" title="Pure White & Haki Red"></button>
        <button type="button" class="color-swatch" data-eye="#ff2e43" data-aura="#ff0022" style="background: linear-gradient(135deg, #ff2e43 55%, #111111 55%);" title="Conqueror Crimson"></button>
        <button type="button" class="color-swatch selected" data-eye="#ff6b35" data-aura="#ffd166" style="background: linear-gradient(135deg, #ff6b35 55%, #ffd166 55%);" title="Solar Orange"></button>
        <button type="button" class="color-swatch" data-eye="#38bdf8" data-aura="#0284c7" style="background: linear-gradient(135deg, #38bdf8 55%, #0284c7 55%);" title="Electric Cyan"></button>
        <button type="button" class="color-swatch" data-eye="#fde047" data-aura="#eab308" style="background: linear-gradient(135deg, #fde047 55%, #a855f7 55%);" title="Gear-5 Sun Gold"></button>
      </div>
    </div>

    <!-- Interactive FX Modes (4 Modes) -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] tracking-[0.14em] uppercase text-[#8a8a90] font-medium">MODE</span>
      </div>
      <div class="grid grid-cols-4 gap-2" id="mode-buttons">
        <!-- 1. Haki Lightning + Gaze -->
        <button type="button" class="mode-chip" data-mode="haki" title="Live Eye Tracking + Click for Haki Lightning">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </button>
        <!-- 2. Interactive Web-Shooter -->
        <button type="button" class="mode-chip" data-mode="web" title="Web-Shooter Mode (Click to shoot webs)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="3" x2="12" y2="21"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
          </svg>
        </button>
        <!-- 3. Overdrive Aura -->
        <button type="button" class="mode-chip selected" data-mode="overdrive" title="Conqueror's Haki Overdrive Aura">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <!-- 4. Dot-Matrix Halftone -->
        <button type="button" class="mode-chip" data-mode="halftone" title="Dot-Matrix Halftone Shader">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
            <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
            <circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

          <path id="scar-shape" d="M 714 567 L 716 567 L 717 568 L 719 568 L 720 569 L 724 569 L 725 570 L 729 570 L 730 571 L 735 571 L 736 572 L 744 572 L 745 573 L 748 573 L 750 575 L 750 576 L 751 577 L 751 580 L 752 581 L 752 583 L 753 584 L 753 587 L 754 588 L 754 589 L 754 582 L 755 581 L 755 576 L 756 575 L 756 573 L 758 571 L 761 571 L 762 570 L 768 570 L 769 569 L 773 569 L 774 568 L 777 568 L 778 567 L 780 567 L 781 566 L 784 566 L 786 568 L 786 569 L 787 570 L 787 572 L 788 573 L 788 575 L 789 576 L 789 578 L 790 579 L 790 581 L 790 574 L 789 573 L 789 564 L 792 561 L 793 561 L 795 559 L 796 559 L 799 556 L 800 556 L 804 552 L 803 552 L 802 553 L 801 553 L 799 555 L 798 555 L 797 556 L 796 556 L 795 557 L 794 557 L 793 558 L 790 558 L 787 555 L 787 554 L 786 553 L 786 552 L 785 551 L 785 550 L 785 556 L 784 557 L 784 558 L 781 561 L 780 561 L 779 562 L 777 562 L 776 563 L 772 563 L 771 564 L 766 564 L 765 565 L 757 565 L 756 564 L 755 564 L 754 563 L 754 562 L 753 561 L 753 559 L 752 558 L 752 556 L 751 555 L 751 552 L 750 551 L 750 550 L 750 559 L 749 560 L 749 565 L 746 568 L 719 568 L 718 567 Z" />
        </g>
      </svg>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. SYNTHESIZED WEB AUDIO ENGINE (Haki Pulse, Web Thwip & Tactile Clicks)
    // =========================================================================
    let audioCtx = null;

    function getAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick(freq = 620, dur = 0.03) {
      const ctx = getAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.4, ctx.currentTime + dur);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    }

    function playHakiBurstSound() {
      const ctx = getAudio();
      if (!ctx) return;
      // Sub-bass impact + electric crackle sweep
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(135, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(34, ctx.currentTime + 0.42);
      gain.gain.setValueAtTime(0.24, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.45);
    }

    function playWebThwipSound() {
      const ctx = getAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1480, ctx.currentTime + 0.09);
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.11);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.11);
    }

    // =========================================================================
    // 2. THREE.JS WEBGL 3D PARTICLE AURA & DEPTH FIELD
    // =========================================================================
    let webglParticlesMat = null;
    function initWebGL() {
      const canvas = document.getElementById('webgl-aura');
      if (!window.THREE || !canvas) return;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 10;

      const count = 95;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const speeds = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        pos[i * 3] = (Math.random() - 0.5) * 18;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 14;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 6;
        speeds[i] = 0.008 + Math.random() * 0.018;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      webglParticlesMat = new THREE.PointsMaterial({
        color: 0xff6b35,
        size: 0.07,
        transparent: true,
        opacity: 0.35
      });

      const points = new THREE.Points(geo, webglParticlesMat);
      scene.add(points);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animateWebGL() {
        requestAnimationFrame(animateWebGL);
        const arr = geo.attributes.position.array;
        const boost = (activeMode === 'overdrive' || isPointerDown) ? 3.5 : 1;
        for (let i = 0; i < count; i++) {
          arr[i * 3 + 1] += speeds[i] * boost;
          if (arr[i * 3 + 1] > 7) arr[i * 3 + 1] = -7;
        }
        geo.attributes.position.needsUpdate = true;
        points.rotation.y += 0.001 * boost;
        renderer.render(scene, camera);
      }
      animateWebGL();
    }

    // =========================================================================
    // 3. LIVE CURSOR GAZE TRACKING, 3D HEAD TILT & AUTONOMOUS BLINKING
    // =========================================================================
    const rigEl = document.getElementById('character-rig');
    const eyesScarRig = document.getElementById('eyes-scar-rig');
    const leftEye = document.getElementById('left-eye');
    const rightEye = document.getElementById('right-eye');
    const svgEl = document.getElementById('character-svg');

    let targetEyeX = 0, targetEyeY = 0;
    let curEyeX = 0, curEyeY = 0;
    let targetRotX = 0, targetRotY = 0;
    let curRotX = 0, curRotY = 0;
    let isPointerDown = false;
    let activeMode = 'overdrive'; // 'haki', 'web', 'overdrive', 'halftone'

    function handlePointerMove(clientX, clientY) {
      const nx = (clientX / window.innerWidth - 0.5) * 2;  // -1 to +1
      const ny = (clientY / window.innerHeight - 0.5) * 2; // -1 to +1

      // Eyes & scar shift inside the shadow face to look directly at the user's cursor
      targetEyeX = nx * 28;
      targetEyeY = ny * 20;

      // Subtle 3D head & spiky hair perspective turn
      targetRotY = nx * 8.5;
      targetRotX = -ny * 6.5;
    }

    window.addEventListener('mousemove', (e) => {
      handlePointerMove(e.clientX, e.clientY);
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    function updateRigPhysics() {
      curEyeX += (targetEyeX - curEyeX) * 0.16;
      curEyeY += (targetEyeY - curEyeY) * 0.16;
      curRotX += (targetRotX - curRotX) * 0.12;
      curRotY += (targetRotY - curRotY) * 0.12;

      eyesScarRig.style.transform = `translate(${curEyeX.toFixed(2)}px, ${curEyeY.toFixed(2)}px)`;
      rigEl.style.transform = `scale(1.04) rotateX(${(curRotX * 0.6).toFixed(2)}deg) rotateY(${(curRotY * 0.6).toFixed(2)}deg)`;
      document.getElementById('portrait-stage').style.transform = `perspective(1000px) rotateX(${curRotX.toFixed(2)}deg) rotateY(${curRotY.toFixed(2)}deg)`;

      requestAnimationFrame(updateRigPhysics);
    }
    updateRigPhysics();

    // Natural Autonomous Eye Blinking Loop
    function triggerBlink() {
      if (!isPointerDown) {
        leftEye.classList.add('eye-blink');
        rightEye.classList.add('eye-blink');
        setTimeout(() => {
          leftEye.classList.remove('eye-blink');
          rightEye.classList.remove('eye-blink');
        }, 130);
      }
      setTimeout(triggerBlink, 2400 + Math.random() * 2800);
    }
    setTimeout(triggerBlink, 2000);

    // Double-Click on Eyes/Stage for Playful Luffy Wink
    document.getElementById('portrait-stage').addEventListener('dblclick', () => {
      rightEye.classList.add('eye-blink');
      leftEye.classList.add('eye-wide');
      playTick(880, 0.08);
      setTimeout(() => {
        rightEye.classList.remove('eye-blink');
        leftEye.classList.remove('eye-wide');
      }, 420);
    });

    // Interactive Suit Web Cells Ripple on Hover & Click
    const suitCells = document.querySelectorAll('.suit-cell');
    suitCells.forEach((cell, idx) => {
      cell.addEventListener('mouseenter', () => {
        playTick(420 + (idx % 12) * 35, 0.018);
      });
      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        playWebThwipSound();
        // Ripple wave across all 24 suit web panels
        suitCells.forEach((c, j) => {
          setTimeout(() => {
            c.classList.add('pulse-cell');
            setTimeout(() => c.classList.remove('pulse-cell'), 260);
          }, Math.abs(idx - j) * 28);
        });
      });
    });

    // =========================================================================
    // 4. INTERACTIVE 2D FX ENGINE (Haki Lightning Bolts, Spider-Sense & Webs)
    // =========================================================================
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    const lightningBolts = [];
    const shockwaves = [];
    const webStrands = [];

    function resizeFxCanvas() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    resizeFxCanvas();
    window.addEventListener('resize', resizeFxCanvas);

    // Get screen coordinates of the character's eyes for spawning lightning/spider-sense
    function getEyeScreenCenters() {
      const lRect = leftEye.getBoundingClientRect();
      const rRect = rightEye.getBoundingClientRect();
      return {
        left: { x: lRect.left + lRect.width / 2, y: lRect.top + lRect.height / 2 },
        right: { x: rRect.left + rRect.width / 2, y: rRect.top + rRect.height / 2 },
        mid: { x: (lRect.left + rRect.right) / 2, y: (lRect.top + rRect.bottom) / 2 }
      };
    }

    function spawnHakiLightning(originX, originY, targetX, targetY, color) {
      const segments = [];
      let cx = originX;
      let cy = originY;
      const steps = 12;
      const dx = (targetX - originX) / steps;
      const dy = (targetY - originY) / steps;

      for (let i = 1; i <= steps; i++) {
        const jitter = (i === steps) ? 0 : (Math.random() - 0.5) * 48;
        const nx = originX + dx * i + jitter;
        const ny = originY + dy * i + jitter;
        segments.push({ x1: cx, y1: cy, x2: nx, y2: ny });
        cx = nx;
        cy = ny;
      }
      lightningBolts.push({ segments, alpha: 1.0, color, width: 3.5 + Math.random() * 2.5 });
    }

    function triggerHakiBurst(clientX, clientY) {
      const eyes = getEyeScreenCenters();
      const st = getComputedStyle(document.documentElement);
      const auraCol = st.getPropertyValue('--aura-color').trim() || '#ff2e43';
      const eyeCol = st.getPropertyValue('--eye-color').trim() || '#ffffff';

      // Bolts from both eyes toward cursor and outward
      spawnHakiLightning(eyes.left.x, eyes.left.y, clientX, clientY, auraCol);
      spawnHakiLightning(eyes.right.x, eyes.right.y, clientX, clientY, eyeCol);

      for (let i = 0; i < 5; i++) {
        const ang = (Math.PI * 2 * i) / 5 + Math.random() * 0.6;
        const dist = 160 + Math.random() * 220;
        spawnHakiLightning(
          eyes.mid.x,
          eyes.mid.y,
          eyes.mid.x + Math.cos(ang) * dist,
          eyes.mid.y + Math.sin(ang) * dist,
          i % 2 === 0 ? auraCol : '#050507'
        );
      }

      shockwaves.push({ x: eyes.mid.x, y: eyes.mid.y, r: 20, maxR: 280, alpha: 0.85, color: auraCol });
      playHakiBurstSound();
    }

    function shootSpiderWeb(targetX, targetY) {
      const eyes = getEyeScreenCenters();
      const startX = eyes.mid.x;
      const startY = eyes.mid.y + 180; // Launches from lower neck/shoulder
      webStrands.push({
        x1: startX,
        y1: startY,
        x2: targetX,
        y2: targetY,
        progress: 0,
        alpha: 1.0
      });
      playWebThwipSound();
    }

    // Mouse / Touch Down Interaction
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#glyph-hamburger') || e.target.closest('#customizer-pod')) return;
      isPointerDown = true;
      rigEl.classList.add('haki-active');
      leftEye.classList.add('eye-squint');
      rightEye.classList.add('eye-squint');

      if (activeMode === 'web') {
        shootSpiderWeb(e.clientX, e.clientY);
      } else {
        triggerHakiBurst(e.clientX, e.clientY);
      }
    });

    window.addEventListener('mouseup', () => {
      isPointerDown = false;
      if (activeMode !== 'overdrive') {
        rigEl.classList.remove('haki-active');
        leftEye.classList.remove('eye-squint');
        rightEye.classList.remove('eye-squint');
      }
    });

    // Render loop for 2D FX Canvas
    let frameCount = 0;
    function renderFxLoop() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      frameCount++;

      // Continuous ambient Haki lightning in Overdrive mode
      if (activeMode === 'overdrive' && frameCount % 9 === 0) {
        const eyes = getEyeScreenCenters();
        const st = getComputedStyle(document.documentElement);
        const auraCol = st.getPropertyValue('--aura-color').trim() || '#ff2e43';
        const ang = Math.random() * Math.PI * 2;
        const dist = 120 + Math.random() * 180;
        const src = Math.random() > 0.5 ? eyes.left : eyes.right;
        spawnHakiLightning(src.x, src.y, src.x + Math.cos(ang) * dist, src.y + Math.sin(ang) * dist, auraCol);
      }

      // Draw Shockwave Rings (Spider-Sense / Haki)
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 0.14;
        sw.alpha *= 0.91;
        if (sw.alpha < 0.02) {
          shockwaves.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.beginPath();
        fxCtx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        fxCtx.strokeStyle = sw.color;
        fxCtx.globalAlpha = sw.alpha;
        fxCtx.lineWidth = 3;
        fxCtx.stroke();
        fxCtx.restore();
      }

      // Draw Conqueror's Haki Lightning Bolts
      for (let i = lightningBolts.length - 1; i >= 0; i--) {
        const b = lightningBolts[i];
        b.alpha *= 0.86;
        if (b.alpha < 0.03) {
          lightningBolts.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.globalAlpha = b.alpha;
        fxCtx.strokeStyle = b.color;
        fxCtx.shadowColor = b.color;
        fxCtx.shadowBlur = 16;
        fxCtx.lineWidth = b.width;
        fxCtx.lineCap = 'round';
        fxCtx.beginPath();
        b.segments.forEach((seg) => {
          fxCtx.moveTo(seg.x1, seg.y1);
          fxCtx.lineTo(seg.x2, seg.y2);
        });
        fxCtx.stroke();
        fxCtx.restore();
      }

      // Draw Interactive Spider-Web Strands
      for (let i = webStrands.length - 1; i >= 0; i--) {
        const ws = webStrands[i];
        ws.progress = Math.min(1, ws.progress + 0.18);
        ws.alpha *= 0.985;
        if (ws.alpha < 0.03) {
          webStrands.splice(i, 1);
          continue;
        }
        const curX = ws.x1 + (ws.x2 - ws.x1) * ws.progress;
        const curY = ws.y1 + (ws.y2 - ws.y1) * ws.progress;

        fxCtx.save();
        fxCtx.globalAlpha = ws.alpha;
        fxCtx.strokeStyle = '#ffffff';
        fxCtx.lineWidth = 2.2;
        fxCtx.beginPath();
        fxCtx.moveTo(ws.x1, ws.y1);
        fxCtx.lineTo(curX, curY);
        fxCtx.stroke();

        // Web anchor node at target when fully extended
        if (ws.progress >= 1) {
          for (let r = 8; r <= 24; r += 8) {
            fxCtx.beginPath();
            fxCtx.arc(ws.x2, ws.y2, r, 0, Math.PI * 2);
            fxCtx.lineWidth = 1.2;
            fxCtx.stroke();
          }
        }
        fxCtx.restore();
      }

      requestAnimationFrame(renderFxLoop);
    }
    renderFxLoop();

    // =========================================================================
    // 5. UNIQUE 3x3 GLYPH HAMBURGER & 5-COLOR / MODE CUSTOMIZER LOGIC
    // =========================================================================
    const hamBtn = document.getElementById('glyph-hamburger');
    const podEl = document.getElementById('customizer-pod');

    hamBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = podEl.classList.toggle('active');
      hamBtn.classList.toggle('open', open);
      playTick(open ? 780 : 480);
    });

    document.addEventListener('click', (e) => {
      if (!podEl.contains(e.target) && !hamBtn.contains(e.target)) {
        podEl.classList.remove('active');
        hamBtn.classList.remove('open');
      }
    });

    // 1. BG Swatches (Limit 5)
    document.querySelectorAll('#bg-swatches .color-swatch').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#bg-swatches .color-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.documentElement.style.setProperty('--bg-color', btn.dataset.bg);
        playTick(620);
      });
    });

    // 2. Suit Swatches (Limit 5)
    document.querySelectorAll('#suit-swatches .color-swatch').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#suit-swatches .color-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.documentElement.style.setProperty('--suit-color', btn.dataset.suit);
        playTick(680);
      });
    });

    // 3. Eye & Scar Glow Swatches (Limit 5)
    document.querySelectorAll('#eye-swatches .color-swatch').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#eye-swatches .color-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.documentElement.style.setProperty('--eye-color', btn.dataset.eye);
        document.documentElement.style.setProperty('--aura-color', btn.dataset.aura);
        if (webglParticlesMat) {
          webglParticlesMat.color.set(btn.dataset.eye);
        }
        playTick(740);
      });
    });

    // 4. Interactive Mode Buttons
    document.querySelectorAll('#mode-buttons .mode-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#mode-buttons .mode-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        activeMode = chip.dataset.mode;

        document.body.classList.remove('mode-overdrive', 'mode-halftone');
        leftEye.classList.remove('eye-squint');
        rightEye.classList.remove('eye-squint');

        if (activeMode === 'overdrive') {
          document.body.classList.add('mode-overdrive');
          leftEye.classList.add('eye-squint');
          rightEye.classList.add('eye-squint');
          playHakiBurstSound();
        } else if (activeMode === 'halftone') {
          document.body.classList.add('mode-halftone');
          playTick(700);
        } else {
          playTick(650);
        }
      });
    });

    window.onload = () => {
      initWebGL();
    };
  </script>
