<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER GAMEBOY - Interactive 3D Retro Desktop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP for smooth procedural animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1612;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            cursor: none;
        }
        a, button, input {
            cursor: none !important;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Custom Interactive Hand & Pointer Cursor Overlay (Purely Visual, Zero Text) */
        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            pointer-events: none;
            transform: translate3d(-100px, -100px, 0);
            transition: transform 0.04s linear;
        }
        #cursor-ring {
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cursor-hover #cursor-ring {
            transform: scale(1.35);
            border-color: #a3e635;
            background-color: rgba(163, 230, 53, 0.14);
        }
        .cursor-click #cursor-inner {
            transform: scale(0.78);
        }
        /* Sleek Bottom Camera Menu Styling */
        .cam-btn {
            background: rgba(43, 36, 30, 0.85);
            border: 1px solid rgba(168, 150, 126, 0.28);
            color: #e5dec9;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cam-btn:hover {
            background: rgba(68, 57, 47, 0.95);
            border-color: rgba(163, 230, 53, 0.65);
            color: #ffffff;
            transform: translateY(-1px);
        }
        .cam-btn.active {
            background: rgba(163, 230, 53, 0.16);
            border-color: #a3e635;
            color: #d9f99d;
            box-shadow: 0 0 12px rgba(163, 230, 53, 0.2);
        }
        /* Unique Retro Hardware Launcher & Expandable Dock */
        #retro-dock-panel {
            transition: all 0.38s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: bottom center;
        }
        #retro-dock-panel.dock-closed {
            opacity: 0;
            transform: translateY(24px) scale(0.92);
            pointer-events: none;
        }
        #retro-dock-panel.dock-open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        #dpad-cross {
            transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .launcher-active #dpad-cross {
            transform: rotate(45deg) scale(1.08);
        }
        .launcher-active #launcher-led {
            background-color: #a3e635;
            box-shadow: 0 0 10px #a3e635;
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Container -->
    <div id="canvas-container"></div>

    <!-- Unique Retro Hardware Launcher & Expandable Control Deck -->
    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 flex flex-col items-center pointer-events-none">
        
        <!-- Expandable All-in-One Control Deck (Opens when clicking the unique launcher) -->
        <div id="retro-dock-panel" class="dock-closed mb-3.5 px-5 py-4 rounded-2xl bg-[#211c17]/92 backdrop-blur-xl border border-[#857259]/45 shadow-[0_18px_45px_rgba(0,0,0,0.8)] flex flex-col gap-3 max-w-[95vw]">
            
            <!-- Row 1: CRT Screen Modes + Clock/Timer Controls + Audio Toggle -->
            <div class="flex flex-wrap items-center justify-center gap-2 pb-2.5 border-b border-[#6e5a44]/30">
                <!-- Screen Mode Buttons -->
                <div class="flex items-center gap-1.5">
                    <button id="mode-cat" onclick="setScreenMode('cat')" class="cam-btn active px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                        <span>🐱</span> Cat + Type
                    </button>
                    <button id="mode-terminal" onclick="setScreenMode('terminal')" class="cam-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                        <span>⌨️</span> Full Pad
                    </button>
                    <button id="mode-game" onclick="setScreenMode('game')" class="cam-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                        <span>🕹️</span> Snake
                    </button>
                </div>

                <span class="text-[#6e5a44]/60 mx-0.5">|</span>

                <!-- Clock & Timer Controls -->
                <div class="flex flex-wrap items-center gap-1.5 bg-[#16120e]/70 px-2.5 py-1 rounded-xl border border-[#6e5a44]/30">
                    <button id="clock-mode-btn" onclick="toggleClockTimerMode()" class="cam-btn px-2.5 py-1 rounded-md text-xs font-mono text-lime-300">
                        ⏰ MODE: CLOCK
                    </button>
                    <div id="timer-controls" class="hidden flex items-center gap-1">
                        <button id="timer-play-btn" onclick="startPauseTimer()" class="cam-btn px-2.5 py-1 rounded-md text-xs font-mono text-amber-300">
                            ▶ START
                        </button>
                        <button onclick="adjustTimer(60)" class="cam-btn px-2 py-1 rounded-md text-xs font-mono">+1m</button>
                        <button onclick="adjustTimer(10)" class="cam-btn px-2 py-1 rounded-md text-xs font-mono">+10s</button>
                        <button onclick="resetTimer()" class="cam-btn px-2 py-1 rounded-md text-xs font-mono text-rose-300">RST</button>
                    </div>
                </div>

                <span class="text-[#6e5a44]/60 mx-0.5">|</span>

                <!-- SFX Mute Toggle -->
                <button id="sfx-toggle-btn" onclick="toggleMute()" class="cam-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 text-amber-300">
                    <span id="sfx-icon">🔊</span> <span id="sfx-label">SFX On</span>
                </button>
            </div>

            <!-- Row 2: Camera Presets -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <span class="text-[10px] font-bold tracking-widest uppercase text-[#a89c8a] mr-1">CAMERA:</span>
                <button id="cam-overview" onclick="moveCamera('overview')" class="cam-btn active px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <span>📷</span> Desk Overview
                </button>
                <button id="cam-monitor" onclick="moveCamera('monitor')" class="cam-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <span>🖥️</span> CRT Monitor
                </button>
                <button id="cam-keyboard" onclick="moveCamera('keyboard')" class="cam-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <span>⌨️</span> 3D Keyboard
                </button>
                <button id="cam-fanclock" onclick="moveCamera('fanclock')" class="cam-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <span>🌀</span> Fan &amp; Timer Clock
                </button>
                <button id="cam-arcade" onclick="moveCamera('arcade')" class="cam-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <span>🕹️</span> Left Accessories
                </button>
            </div>
        </div>

        <!-- Unique Tactile Retro D-Pad / Cartridge Launcher Button (Not a typical 3-line hamburger!) -->
        <button id="retro-launcher-btn" onclick="toggleRetroDock()" class="pointer-events-auto group relative flex items-center gap-3 px-4 py-2 rounded-2xl bg-[#cfc5b4] hover:bg-[#dfd6c7] border-2 border-[#52483e] shadow-[0_5px_0_#423930,0_10px_25px_rgba(0,0,0,0.75)] active:translate-y-1 active:shadow-[0_1px_0_#423930] transition-all duration-150">
            <!-- Status LED Dot -->
            <span id="launcher-led" class="w-2.5 h-2.5 rounded-full bg-[#e86f2c] shadow-[0_0_6px_#e86f2c] transition-all duration-300"></span>
            
            <!-- Rotating Tactile D-Pad Cross Icon (Rotates 45° into an 'X' when opened) -->
            <div class="w-7 h-7 rounded-lg bg-[#2b2621] border border-[#52483e] flex items-center justify-center shadow-inner">
                <svg id="dpad-cross" class="w-4 h-4 text-[#e86f2c] group-hover:text-lime-400 transition-colors" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3z" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="2" fill="#2b2621"/>
                </svg>
            </div>

            <!-- Retro Console Slot Label & Twin A/B Pill Accents -->
            <div class="flex flex-col items-start pr-1">
                <span class="text-[10px] font-extrabold tracking-widest uppercase text-[#2b2621] leading-none" style="font-family: 'Press Start 2P', monospace; font-size: 9px;">DECK OS</span>
                <span id="launcher-subtext" class="text-[10px] font-semibold text-[#5c5246] leading-tight mt-0.5">OPEN CONTROLS</span>
            </div>

            <div class="flex items-center gap-1 pl-1 border-l border-[#a39887]">
                <span class="w-2.5 h-4 rounded-full bg-[#b8332a] -rotate-12 shadow-sm"></span>
                <span class="w-2.5 h-4 rounded-full bg-[#e86f2c] -rotate-12 shadow-sm"></span>
            </div>
        </button>
    </div>

    <!-- Custom Stylish Hand / Pointer Cursor Overlay (Purely Visual, No Text Badge) -->
    <div id="custom-cursor" class="flex items-center justify-center">
        <div id="cursor-inner" class="relative flex items-center justify-center transition-transform duration-100">
            <!-- Outer Tactical Ring -->
            <div id="cursor-ring" class="w-9 h-9 rounded-full border-2 border-amber-400/75 bg-amber-500/10 flex items-center justify-center shadow-[0_0_12px_rgba(251,191,36,0.35)]"></div>
            <!-- Default Sleek Pointer SVG -->
            <svg id="cursor-arrow" class="w-5 h-5 text-amber-300 absolute drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4.5 3.5L19.5 11L12.5 13.5L10 20.5L4.5 3.5Z" stroke="#1a1612" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <!-- Interactive Hand Gesture SVG (Shown when hovering 3D interactables) -->
            <svg id="cursor-hand" class="w-6 h-6 text-lime-300 absolute hidden drop-shadow-[0_2px_6px_rgba(0,0,0,0.95)]" viewBox="0 0 24 24" fill="currentColor">
                <path d="M9 11.24V6.5C9 5.12 10.12 4 11.5 4S14 5.12 14 6.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z" stroke="#1a1612" stroke-width="1.2"/>
            </svg>
        </div>
    </div>

    <script>
        // ============================================================================
        // 1. WEB AUDIO API PROCEDURAL SOUND SYNTHESIZER
        // ============================================================================
        class RetroSoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.fanNode = null;
                this.fanGain = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Mechanical Keyboard "Thock" + Click Sound
            playKeystroke(pitchShift = 1.0) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;

                // Short percussive body thock
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(175 * pitchShift, now);
                osc.frequency.exponentialRampToValueAtTime(42, now + 0.048);

                gain.gain.setValueAtTime(0.32, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.052);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.055);

                // High frequency keycap click transient
                const clickOsc = this.ctx.createOscillator();
                const clickGain = this.ctx.createGain();
                clickOsc.type = 'sine';
                clickOsc.frequency.setValueAtTime(2500 * pitchShift, now);
                clickOsc.frequency.exponentialRampToValueAtTime(850, now + 0.012);

                clickGain.gain.setValueAtTime(0.13, now);
                clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);

                clickOsc.connect(clickGain);
                clickGain.connect(this.ctx.destination);
                clickOsc.start(now);
                clickOsc.stop(now + 0.016);
            }

            // Tactile Plastic Switch / Button Click
            playSwitch(high = true) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(high ? 980 : 640, now);
                osc.frequency.exponentialRampToValueAtTime(high ? 340 : 190, now + 0.035);
                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.045);
            }

            // Classic Gameboy Startup Chime ("Ba-ding!")
            playGameboyDing() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [987.77, 1318.51]; // B5 -> E6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    const start = now + idx * 0.09;
                    const dur = idx === 0 ? 0.09 : 0.45;
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.14, start);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(start);
                    osc.stop(start + dur + 0.02);
                });
            }

            // Cartridge Clunk Sound
            playCartridge(inserted = true) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(inserted ? 110 : 160, now);
                osc.frequency.setValueAtTime(inserted ? 220 : 95, now + 0.05);
                gain.gain.setValueAtTime(0.24, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);

                if (inserted) {
                    setTimeout(() => this.playGameboyDing(), 180);
                }
            }

            // Digital Alarm Clock / Timer Beep-Beep
            playAlarmBeep() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                for (let i = 0; i < 4; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    const t = now + i * 0.13;
                    osc.frequency.setValueAtTime(2048, t);
                    gain.gain.setValueAtTime(0.13, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.09);
                }
            }

            // Update Fan Whirr Sound (4 Speed Levels: 0=Off, 1=Low, 2=Med, 3=Turbo)
            updateFanSound(speedLevel) {
                if (this.muted) {
                    if (this.fanGain && this.ctx) {
                        this.fanGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
                    }
                    return;
                }
                this.init();
                if (!this.fanNode) {
                    this.fanNode = this.ctx.createOscillator();
                    this.fanGain = this.ctx.createGain();
                    this.fanNode.type = 'sine';
                    this.fanNode.frequency.setValueAtTime(65, this.ctx.currentTime);
                    this.fanGain.gain.setValueAtTime(0, this.ctx.currentTime);
                    this.fanNode.connect(this.fanGain);
                    this.fanGain.connect(this.ctx.destination);
                    this.fanNode.start();
                }
                const gains = [0, 0.025, 0.045, 0.07];
                const freqs = [50, 72, 98, 128];
                this.fanNode.frequency.setTargetAtTime(freqs[speedLevel] || 0, this.ctx.currentTime, 0.25);
                this.fanGain.gain.setTargetAtTime(gains[speedLevel] || 0, this.ctx.currentTime, 0.2);
            }
        }

        const sfx = new RetroSoundEngine();
        let sideDialLedMesh = null;
        let kbAudioLedMesh = null;
        let dockOpen = false;

        function toggleRetroDock() {
            dockOpen = !dockOpen;
            sfx.playSwitch(dockOpen);
            const panel = document.getElementById('retro-dock-panel');
            const btn = document.getElementById('retro-launcher-btn');
            const subtext = document.getElementById('launcher-subtext');
            if (panel) {
                panel.classList.toggle('dock-closed', !dockOpen);
                panel.classList.toggle('dock-open', dockOpen);
            }
            if (btn) {
                btn.classList.toggle('launcher-active', dockOpen);
            }
            if (subtext) {
                subtext.textContent = dockOpen ? 'HIDE CONTROLS' : 'OPEN CONTROLS';
            }
        }

        function toggleMute() {
            sfx.muted = !sfx.muted;
            sfx.updateFanSound(state.fanSpeed);
            if (!sfx.muted) {
                sfx.playSwitch(true);
            }
            if (sideDialLedMesh) {
                sideDialLedMesh.material = sfx.muted ? mats.ledOff : mats.ledGreen;
            }
            if (kbAudioLedMesh) {
                kbAudioLedMesh.material = sfx.muted ? mats.ledOff : mats.ledGreen;
            }
            const sfxIcon = document.getElementById('sfx-icon');
            const sfxLabel = document.getElementById('sfx-label');
            if (sfxIcon) sfxIcon.textContent = sfx.muted ? '🔇' : '🔊';
            if (sfxLabel) sfxLabel.textContent = sfx.muted ? 'SFX Muted' : 'SFX On';
        }

        function showToast(_msg) {
            // Intentionally silent/no-op for a 100% clean, textless discovery experience
        }

        // ============================================================================
        // 2. GLOBAL SCENE STATE (INCLUDING CAT SCREEN INPUT & LIVE CLOCK/TIMER)
        // ============================================================================
        const state = {
            screenMode: 'cat', // 'cat', 'terminal', 'game'
            catInputText: '', // Real-time text appended directly after 'Type: ' underneath loading...
            typedText: 'HELLO SUPER GAMEBOY!\nTYPE ON YOUR KEYBOARD\nOR CLICK 3D KEYS...\n> ',
            marqueeOn: true,
            crtPower: true,
            fanSpeed: 2, // 0: off, 1: low, 2: med, 3: turbo
            clock24h: false,
            // Interactive Clock & Timer state
            clockMode: 'clock', // 'clock' or 'timer'
            timerSeconds: 180,  // Default 03:00 countdown
            timerRunning: false,
            timerAlertFlashing: false,
            cartridgeInserted: true,
            activeCartridgeTitle: 'SUPER CAT OS v4.0',
            catJumpOffset: 0,
            catHearts: [],
            // Mini-game (Snake) state
            snake: [{x: 8, y: 6}, {x: 7, y: 6}, {x: 6, y: 6}],
            snakeDir: {x: 1, y: 0},
            food: {x: 13, y: 6},
            score: 0,
            lastSnakeTick: 0
        };

        // ============================================================================
        // 3. THREE.JS SCENE, CAMERA & RENDERER SETUP
        // ============================================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1f1a16);
        scene.fog = new THREE.FogExp2(0x1f1a16, 0.018);

        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(-7.2, 8.8, 13.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(0.3, 2.2, 0.5);
        controls.maxPolarAngle = Math.PI / 2 - 0.03;
        controls.minDistance = 3.5;
        controls.maxDistance = 26;

        // ============================================================================
        // 4. COZY STUDIO LIGHTING
        // ============================================================================
        const ambientLight = new THREE.AmbientLight(0xffeedd, 0.58);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xfff3e0, 1.18);
        keyLight.position.set(9, 15, 10);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 2;
        keyLight.shadow.camera.far = 35;
        const d = 10;
        keyLight.shadow.camera.left = -d;
        keyLight.shadow.camera.right = d;
        keyLight.shadow.camera.top = d;
        keyLight.shadow.camera.bottom = -d;
        keyLight.shadow.bias = -0.0005;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x90b4d4, 0.38);
        fillLight.position.set(-10, 6, 4);
        scene.add(fillLight);

        const marqueeLight = new THREE.PointLight(0xff7b1c, 1.1, 5.5);
        marqueeLight.position.set(-0.8, 5.6, 0.1);
        scene.add(marqueeLight);

        const crtLight = new THREE.PointLight(0xa8ff3e, 0.85, 5.0);
        crtLight.position.set(-0.8, 3.6, 1.8);
        scene.add(crtLight);

        // ============================================================================
        // 5. SHARED RETRO MATERIALS & INTERACTABLES REGISTRY
        // ============================================================================
        const mats = {
            beigeLight: new THREE.MeshStandardMaterial({ color: 0xd8cfc0, roughness: 0.52, metalness: 0.05 }),
            beigeMedium: new THREE.MeshStandardMaterial({ color: 0xc2b7a5, roughness: 0.58, metalness: 0.05 }),
            beigeDark: new THREE.MeshStandardMaterial({ color: 0x9e9485, roughness: 0.62, metalness: 0.08 }),

        function createRoundedBox(w, h, d, radius = 0.08) {
            const shape = new THREE.Shape();
            const eps = 0.00001;
            const r = Math.min(radius, w * 0.4, h * 0.4, d * 0.4) - eps;
            shape.absarc(eps, eps, eps, -Math.PI / 2, -Math.PI, true);
            shape.absarc(eps, h - r * 2, eps, Math.PI, Math.PI / 2, true);
            shape.absarc(w - r * 2, h - r * 2, eps, Math.PI / 2, 0, true);
            shape.absarc(w - r * 2, eps, eps, 0, -Math.PI / 2, true);

            const geometry = new THREE.ExtrudeGeometry(shape, {
                depth: Math.max(0.001, d - r * 2),
                bevelEnabled: true,
                bevelSegments: 3,
                steps: 1,
                bevelSize: r,
                bevelThickness: r,
                curveSegments: 6
            });
            geometry.center();
            return geometry;
        }

        // --- B. Main Green CRT Screen Canvas Texture (Matching Reference Image 3!) ---
        const crtCanvas = document.createElement('canvas');
        crtCanvas.width = 512;
        crtCanvas.height = 384;
        const cCtx = crtCanvas.getContext('2d');
        const crtTexture = new THREE.CanvasTexture(crtCanvas);

        // Pixel Art Cat Bitmap (16x13 grid matching the reference photo's pixel cat)
        const catBitmap = [
            "0000010000010000",
            "0000111000111000",
            "0000111111111000",
            "0001111111111100",
            "0001100111001100",
            "0001100111001100",
            "0001111111111100",
            "1100111111111000",
            "0110111111111100",
            "0011111111111100",
            "0001111111111000",
            "0000110000110000",
            "0000110000110000"
        ];

        function drawCRT(time) {
            if (!state.crtPower) {
                cCtx.fillStyle = '#182214';
                cCtx.fillRect(0, 0, 512, 384);
                crtTexture.needsUpdate = true;
                return;
            }

            // Warm sage/olive-green phosphor background matching Reference Image 3
            const grd = cCtx.createRadialGradient(256, 192, 40, 256, 192, 340);
            grd.addColorStop(0, '#c8df87');
            grd.addColorStop(1, '#b2cc72');
            cCtx.fillStyle = grd;
            cCtx.fillRect(0, 0, 512, 384);

            // Subtle horizontal CRT scanlines
            cCtx.fillStyle = 'rgba(38, 66, 18, 0.075)';
            for (let y = 0; y < 384; y += 3) {
                cCtx.fillRect(0, y, 512, 1);
            }

            // Top thin dark-green framing line (just like Reference Image 3)
            cCtx.fillStyle = '#2d4c17';
            cCtx.fillRect(22, 16, 468, 3);

            if (state.screenMode === 'cat') {
                // 1. Draw Animated Pixel Cat in Center
                const bounce = Math.floor(Math.sin(time * 5.0) * 4) - state.catJumpOffset;
                const pxSize = 11;
                const startX = 256 - (16 * pxSize) / 2;
                const startY = 66 + bounce;

                const blink = Math.sin(time * 3.1) > 0.93;
                const wag = Math.floor(time * 3.5) % 2 === 1;

                for (let r = 0; r < catBitmap.length; r++) {
                    for (let c = 0; c < 16; c++) {
                        let ch = catBitmap[r][c];
                        // Subtle tail wag animation on left pixels
                        if (wag && c < 3 && r >= 7 && r <= 9) {
                            ch = catBitmap[r - 1]?.[c] || '0';
                        }
                        if (ch === '1') {
                            cCtx.fillStyle = '#2b4a15';
                            cCtx.fillRect(startX + c * pxSize, startY + r * pxSize, pxSize - 1.2, pxSize - 1.2);
                        } else if ((r === 4 || r === 5) && (c === 5 || c === 6 || c === 10 || c === 11)) {
                            // Cat Eyes cutout
                            cCtx.fillStyle = blink ? '#2b4a15' : '#c4db83';
                            cCtx.fillRect(startX + c * pxSize, startY + r * pxSize, pxSize - 1.2, pxSize - 1.2);
                        }
                    }
                }

                // Floating hearts when user pets/clicks the cat or types
                state.catHearts.forEach((h) => {
                    h.y -= 1.1;
                    h.alpha -= 0.016;
                    if (h.alpha > 0) {
                        cCtx.fillStyle = `rgba(43, 74, 21, ${h.alpha})`;
                        cCtx.font = '28px "VT323", monospace';
                        cCtx.textAlign = 'center';
                        cCtx.fillText('♥', h.x, h.y);
                    }
                });
                state.catHearts = state.catHearts.filter(h => h.alpha > 0);

                // 2. "loading... ." animation directly beneath the pixel cat
                const dotCycle = Math.floor(time * 2.2) % 4;
                const trailingDots = dotCycle === 0 ? '' : (dotCycle === 1 ? ' .' : (dotCycle === 2 ? ' ..' : ' ...'));
                cCtx.fillStyle = '#2b4a15';
                cCtx.font = '42px "VT323", monospace';
                cCtx.textAlign = 'center';
                cCtx.fillText(`loading...${trailingDots}`, 256, 268);

                // 3. Interactive "Type: " line right underneath loading... (Preserving the rest of the screen!)
                const displayTyped = state.catInputText.length > 18
                    ? state.catInputText.slice(-18)
                    : state.catInputText;
                const labelAndText = `Type: ${displayTyped}`;

                cCtx.font = '34px "VT323", monospace';
                cCtx.fillStyle = 'rgba(43, 74, 21, 0.92)';
                cCtx.textAlign = 'center';

                // Measure text so the solid blinking block cursor sits right after 'Type: [user input]'
                const textMetrics = cCtx.measureText(labelAndText);
                const centerX = 248;
                const baselineY = 334;
                cCtx.fillText(labelAndText, centerX, baselineY);

                // Blinking solid dark-green block cursor right after the typed characters
                if (Math.floor(time * 2.6) % 2 === 0) {
                    const cursorX = centerX + textMetrics.width / 2 + 5;
                    cCtx.fillStyle = '#3c5e1f';
                    cCtx.fillRect(cursorX, baselineY - 26, 15, 30);
                }

            } else if (state.screenMode === 'terminal') {
                // Full Interactive Multi-line Terminal Mode
                cCtx.fillStyle = '#2b4a15';
                cCtx.font = '22px "VT323", monospace';
                cCtx.textAlign = 'left';
                cCtx.fillText('SUPER GAMEBOY WORDPAD [ESC TO CLEAR]', 26, 42);

                cCtx.font = '30px "VT323", monospace';
                const lines = state.typedText.split('\n');
                const visibleLines = lines.slice(-8);
                const cursor = Math.floor(time * 2.8) % 2 === 0 ? '█' : ' ';

                visibleLines.forEach((line, idx) => {
                    const isLast = idx === visibleLines.length - 1;
                    cCtx.fillText(line + (isLast ? cursor : ''), 26, 82 + idx * 36);
                });

            } else if (state.screenMode === 'game') {
                // Playable Retro Snake Mini-Game
                if (time - state.lastSnakeTick > 0.18) {
                    state.lastSnakeTick = time;
                    const head = {
                        x: (state.snake[0].x + state.snakeDir.x + 20) % 20,
                        y: (state.snake[0].y + state.snakeDir.y + 12) % 12
                    };
                    state.snake.unshift(head);
                    if (head.x === state.food.x && head.y === state.food.y) {
                        state.score += 10;
                        sfx.playSwitch(true);
                        state.food = {
                            x: Math.floor(Math.random() * 20),
                            y: Math.floor(Math.random() * 12)
                        };
                    } else {
                        state.snake.pop();
                    }
                }

                cCtx.strokeStyle = '#2b4a15';
                cCtx.lineWidth = 3;
                cCtx.strokeRect(32, 48, 448, 272);

                const cellW = 440 / 20;
                const cellH = 264 / 12;

                cCtx.fillStyle = '#2b4a15';
                cCtx.fillRect(36 + state.food.x * cellW, 52 + state.food.y * cellH, cellW - 3, cellH - 3);

                state.snake.forEach((seg, idx) => {
                    cCtx.fillStyle = idx === 0 ? '#182b0b' : '#35591b';
                    cCtx.fillRect(36 + seg.x * cellW, 52 + seg.y * cellH, cellW - 2, cellH - 2);
                });

                cCtx.fillStyle = '#2b4a15';
                cCtx.font = '24px "VT323", monospace';
                cCtx.textAlign = 'center';
                cCtx.fillText(`SCORE: ${state.score}  |  USE WASD / ARROWS / 3D JOYSTICK`, 256, 352);
            }

            crtTexture.needsUpdate = true;
        }

        // --- C. Live Clocks & Interactive Countdown Timer Display ---
        const miniClockCanvas = document.createElement('canvas');
        miniClockCanvas.width = 256;
        miniClockCanvas.height = 110;
        const mcCtx = miniClockCanvas.getContext('2d');
        const miniClockTexture = new THREE.CanvasTexture(miniClockCanvas);

        const deskClockCanvas = document.createElement('canvas');
        deskClockCanvas.width = 320;
        deskClockCanvas.height = 150;
        const dcCtx = deskClockCanvas.getContext('2d');
        const deskClockTexture = new THREE.CanvasTexture(deskClockCanvas);

        function updateLiveClocks() {
            const now = new Date();
            let hours = now.getHours();
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = now.getSeconds();
            const ampm = hours >= 12 ? 'pm' : 'am';

            const displayHours12 = String(hours % 12 || 12).padStart(2, '0');
            const displayHours24 = String(hours).padStart(2, '0');
            const dateStr = now.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', weekday: 'short' });

            // 1. Mini Sub-Display below CRT (Always keeps Live Real-Time Clock running)
            mcCtx.fillStyle = '#0e170c';
            mcCtx.fillRect(0, 0, 256, 110);
            mcCtx.fillStyle = '#7dff4d';
            mcCtx.font = '22px "VT323", monospace';
            mcCtx.textAlign = 'center';
            mcCtx.fillText(dateStr, 128, 34);
            mcCtx.font = 'bold 48px "VT323", monospace';
            mcCtx.fillText(`${displayHours12}:${mins} ${ampm}`, 128, 82);
            miniClockTexture.needsUpdate = true;

            // 2. Desk Digital Clock & Interactive Timer (Right side of desk)
            const isAlert = state.timerAlertFlashing && secs % 2 === 0;
            dcCtx.fillStyle = isAlert ? '#421810' : '#0f170c';
            dcCtx.fillRect(0, 0, 320, 150);

            // Top mini status indicators directly on the 3D digital clock LCD
            dcCtx.font = '20px "VT323", monospace';
            dcCtx.textAlign = 'left';
            dcCtx.fillStyle = state.clockMode === 'timer' ? '#ffb74d' : '#5cd63a';
            dcCtx.fillText(
                state.clockMode === 'timer'
                    ? (state.timerRunning ? '● TIMER ▶' : '● TIMER ⏸')
                    : (state.clock24h ? '● CLOCK 24H' : '● CLOCK 12H'),
                18,
                24
            );
            dcCtx.textAlign = 'right';
            dcCtx.fillStyle = '#4ea832';
            dcCtx.fillText(
                state.clockMode === 'timer'
                    ? '[M]  [▶/⏸]  [+1m]'
                    : `${String(secs).padStart(2, '0')}s`,
                302,
                24
            );

            // Faint background 88:88 segments
            dcCtx.fillStyle = 'rgba(110, 255, 60, 0.07)';
            dcCtx.font = 'bold 96px "VT323", monospace';
            dcCtx.textAlign = 'center';
            dcCtx.textBaseline = 'middle';
            dcCtx.fillText('88:88', 160, 88);

            // Foreground live digits (Clock vs Countdown Timer)
            dcCtx.fillStyle = isAlert ? '#ff6e40' : (state.clockMode === 'timer' ? '#a8ff3e' : '#80ff33');
            dcCtx.shadowColor = isAlert ? '#ff3d00' : '#66ff00';
            dcCtx.shadowBlur = 12;

            if (state.clockMode === 'timer') {
                const tMins = String(Math.floor(state.timerSeconds / 60)).padStart(2, '0');
                const tSecs = String(state.timerSeconds % 60).padStart(2, '0');
                const colon = !state.timerRunning || secs % 2 === 0 ? ':' : ' ';
                dcCtx.fillText(`${tMins}${colon}${tSecs}`, 160, 88);
            } else {
                const colon = secs % 2 === 0 ? ':' : ' ';
                const hStr = state.clock24h ? displayHours24 : displayHours12;
                dcCtx.fillText(`${hStr}${colon}${mins}`, 160, 88);
            }
            dcCtx.shadowBlur = 0;
            deskClockTexture.needsUpdate = true;
        }

        // Countdown Timer 1-second tick interval
        setInterval(() => {
            if (state.clockMode === 'timer' && state.timerRunning) {
                if (state.timerSeconds > 0) {
                    state.timerSeconds--;
                    if (state.timerSeconds === 0) {
                        state.timerRunning = false;
                        state.timerAlertFlashing = true;
                        sfx.playAlarmBeep();
                        updateTimerUIButtons();
                        showToast("⏰ TIMER FINISHED! 00:00 Reached!");
                        setTimeout(() => { state.timerAlertFlashing = false; updateLiveClocks(); }, 6000);
                    }
                }
            }
            updateLiveClocks();
        }, 1000);
        updateLiveClocks();

        // Clock & Timer Helper Controls
        function updateTimerUIButtons() {
            const modeBtn = document.getElementById('clock-mode-btn');
            const timerCtrls = document.getElementById('timer-controls');
            const playBtn = document.getElementById('timer-play-btn');
            if (modeBtn) {
                modeBtn.textContent = state.clockMode === 'timer' ? '⏱️ MODE: TIMER' : '⏰ MODE: CLOCK';
            }
            if (timerCtrls) {
                timerCtrls.classList.toggle('hidden', state.clockMode !== 'timer');
            }
            if (playBtn) {
                playBtn.textContent = state.timerRunning ? '⏸ PAUSE' : '▶ START';
            }
        }

        function toggleClockTimerMode() {
            state.clockMode = state.clockMode === 'clock' ? 'timer' : 'clock';
            state.timerAlertFlashing = false;
            sfx.playSwitch(true);
            updateTimerUIButtons();
            updateLiveClocks();
            showToast(state.clockMode === 'timer'
                ? "Desk Clock switched to COUNTDOWN TIMER Mode! Use top bar or 3D clock buttons."
                : "Desk Clock switched to LIVE REAL-TIME CLOCK Mode.");
        }

        function startPauseTimer() {
            state.timerAlertFlashing = false;
            if (state.timerSeconds === 0) state.timerSeconds = 60;
            state.timerRunning = !state.timerRunning;
            sfx.playSwitch(state.timerRunning);
            updateTimerUIButtons();
            updateLiveClocks();
            showToast(state.timerRunning ? "Timer Started ▶" : "Timer Paused ⏸");
        }

        function adjustTimer(deltaSec) {
            state.timerAlertFlashing = false;
            state.timerSeconds = Math.max(0, Math.min(5999, state.timerSeconds + deltaSec));
            sfx.playKeystroke(1.15);
            updateLiveClocks();
            const m = String(Math.floor(state.timerSeconds / 60)).padStart(2, '0');
            const s = String(state.timerSeconds % 60).padStart(2, '0');
            showToast(`Timer Set: ${m}:${s}`);
        }

        function resetTimer() {
            state.timerRunning = false;
            state.timerAlertFlashing = false;
            state.timerSeconds = 180;
            sfx.playSwitch(false);
            updateTimerUIButtons();
            updateLiveClocks();
            showToast("Timer Reset to 03:00");

        // ============================================================================
        // 8. BUILD THE "SUPER GAMEBOY" RETRO DESKTOP COMPUTER
        // ============================================================================
        let cartridgeMesh, leftDialMesh, baseJoystickMesh;

        function createSuperGameboyPC() {
            const pcGroup = new THREE.Group();
            pcGroup.position.set(-0.9, 0, -0.35);
            scene.add(pcGroup);

            // --- 1. LOWER CONSOLE DECK BASE ---
            const lowerBase = new THREE.Mesh(createRoundedBox(5.2, 0.75, 4.8, 0.14), mats.beigeMedium);
            lowerBase.position.set(0, 0.38, 0.25);

            upperDeck.position.set(0, 0.95, 0.15);

            upperDeck.receiveShadow = true;
            pcGroup.add(upperDeck);

            // Slanted Front Control Deck Surface
            const controlSlope = new THREE.Mesh(createRoundedBox(4.7, 0.55, 2.1, 0.1), mats.beigeLight);
            controlSlope.position.set(0, 1.25, 1.35);

        // ============================================================================
        // 9. ALPHABET-LABELED 3D MECHANICAL KEYBOARD (CRISP TOP-FACE KEYCAP LEGENDS)

        const keyMeshesByCode = {};

        function createMechanicalKeyboard() {
            const kbGroup = new THREE.Group();
            kbGroup.position.set(1.05, 0, 3.55);
            kbGroup.rotation.y = -0.22;
            scene.add(kbGroup);

            // Slanted Keyboard Chassis

            chassis.receiveShadow = true;
            kbGroup.add(chassis);

            // Recessed Dark Keywell Plate
            const keywell = new THREE.Mesh(new THREE.BoxGeometry(3.32, 0.1, 1.76), mats.beigeDark);
            keywell.position.set(-0.38, 0.39, 0.06);
            keywell.rotation.x = 0.14;
            kbGroup.add(keywell);

            // "SUPER GAMEBOY" orange branding text on top right lip of keyboard
            const brandCanvas = document.createElement('canvas');
            brandCanvas.width = 256;
            brandCanvas.height = 48;
            const bCtx = brandCanvas.getContext('2d');
            bCtx.fillStyle = '#d8cfc0';
            bCtx.fillRect(0, 0, 256, 48);
            bCtx.fillStyle = '#e8511a';
            bCtx.font = 'bold 24px "Press Start 2P", monospace';
            bCtx.fillText('SUPER GAMEBOY', 8, 32);
            const brandPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(1.35, 0.22),
                new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(brandCanvas) })
            );
            brandPlane.rotation.x = -Math.PI / 2 + 0.14;
            brandPlane.position.set(0.85, 0.34, -0.92);
            kbGroup.add(brandPlane);

            // Orange Rotary Volume/Encoder Knob on top right of keyboard
            const orangeKnob = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.21, 0.24, 28), mats.retroOrange);
            orangeKnob.position.set(1.64, 0.44, -0.56);
            orangeKnob.rotation.x = 0.14;
            orangeKnob.castShadow = true;
            kbGroup.add(orangeKnob);

            // Subtle Audio Status LED next to keyboard volume knob
            kbAudioLedMesh = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12), mats.ledGreen);
            kbAudioLedMesh.position.set(1.32, 0.36, -0.56);
            kbGroup.add(kbAudioLedMesh);

            registerInteractable(orangeKnob, "", () => {
                gsap.to(orangeKnob.rotation, { y: orangeKnob.rotation.y + Math.PI / 2, duration: 0.2 });
                toggleMute();
            });

            // Perforated Speaker Grille below orange knob on keyboard right side
            const speakerCanvas = document.createElement('canvas');
            speakerCanvas.width = 128;
            speakerCanvas.height = 128;
            const spCtx = speakerCanvas.getContext('2d');
            spCtx.fillStyle = '#c8beae';
            spCtx.fillRect(0, 0, 128, 128);
            spCtx.fillStyle = '#332f2c';
            for (let r = -3; r <= 3; r++) {
                for (let c = -3; c <= 3; c++) {
                    if (r * r + c * c <= 11) {
                        spCtx.beginPath();
                        spCtx.arc(64 + c * 14, 64 + r * 14, 3.2, 0, Math.PI * 2);
                        spCtx.fill();
                    }
                }
            }
            const speakerRing = new THREE.Mesh(
                new THREE.CylinderGeometry(0.38, 0.38, 0.06, 28),
                new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(speakerCanvas), roughness: 0.6 })
            );
            speakerRing.position.set(1.64, 0.36, 0.24);
            speakerRing.rotation.x = 0.14;
            kbGroup.add(speakerRing);

            // Generate 3D Keycaps with Explicit Crisp Top-Face Alphabet Textures
            const rows = [
                [
                    { label: 'ESC', code: 'Escape', w: 1.05, dark: true },
                    { label: '1', code: 'Digit1', w: 1 },
                    { label: '2', code: 'Digit2', w: 1 },
                    { label: '3', code: 'Digit3', w: 1 },
                    { label: '4', code: 'Digit4', w: 1 },
                    { label: '5', code: 'Digit5', w: 1 },
                    { label: '6', code: 'Digit6', w: 1 },
                    { label: '7', code: 'Digit7', w: 1 },
                    { label: '8', code: 'Digit8', w: 1 },
                    { label: '9', code: 'Digit9', w: 1 },
                    { label: '0', code: 'Digit0', w: 1 },
                    { label: 'DEL', code: 'Backspace', w: 1.25, dark: true }
                ],
                [
                    { label: 'TAB', code: 'Tab', w: 1.2, dark: true },
                    { label: 'Q', code: 'KeyQ', w: 1 },
                    { label: 'W', code: 'KeyW', w: 1 },
                    { label: 'E', code: 'KeyE', w: 1 },
                    { label: 'R', code: 'KeyR', w: 1 },
                    { label: 'T', code: 'KeyT', w: 1 },
                    { label: 'Y', code: 'KeyY', w: 1 },
                    { label: 'U', code: 'KeyU', w: 1 },
                    { label: 'I', code: 'KeyI', w: 1 },
                    { label: 'O', code: 'KeyO', w: 1 },
                    { label: 'P', code: 'KeyP', w: 1.1 }
                ],
                [
                    { label: 'CAPS', code: 'CapsLock', w: 1.3, dark: true },
                    { label: 'A', code: 'KeyA', w: 1 },
                    { label: 'S', code: 'KeyS', w: 1 },
                    { label: 'D', code: 'KeyD', w: 1 },
                    { label: 'F', code: 'KeyF', w: 1 },
                    { label: 'G', code: 'KeyG', w: 1 },
                    { label: 'H', code: 'KeyH', w: 1 },
                    { label: 'J', code: 'KeyJ', w: 1 },
                    { label: 'K', code: 'KeyK', w: 1 },
                    { label: 'L', code: 'KeyL', w: 1 },
                    { label: 'ENT', code: 'Enter', w: 1.35, dark: true }
                ],
                [
                    { label: 'SHF', code: 'ShiftLeft', w: 1.35, dark: true },
                    { label: 'Z', code: 'KeyZ', w: 1 },
                    { label: 'X', code: 'KeyX', w: 1 },
                    { label: 'C', code: 'KeyC', w: 1 },
                    { label: 'V', code: 'KeyV', w: 1 },
                    { label: 'B', code: 'KeyB', w: 1 },
                    { label: 'N', code: 'KeyN', w: 1 },
                    { label: 'M', code: 'KeyM', w: 1 },
                    { label: '.', code: 'Period', w: 1 },
                    { label: 'SPACE', code: 'Space', w: 1.95, dark: true }
                ]
            ];

            const unit = 0.258;
            const startZ = -0.58;

            rows.forEach((row, rIdx) => {
                let curX = -1.90;
                const zPos = startZ + rIdx * 0.40;
                const yBase = 0.49 - rIdx * 0.055;

                row.forEach((k) => {
                    const kw = k.w * unit - 0.032;
                    const kd = unit - 0.032;

                    // Create High-Contrast Keycap Top Texture so Alphabet Characters Pop Clearly
                    const kCanvas = document.createElement('canvas');
                    kCanvas.width = 128;
                    kCanvas.height = 128;
                    const kCtx = kCanvas.getContext('2d');

                    const baseHex = k.dark ? '#736c61' : '#d2c8b6';
                    const topDishHex = k.dark ? '#827a6e' : '#e3dacb';
                    kCtx.fillStyle = baseHex;
                    kCtx.fillRect(0, 0, 128, 128);

                    // Subtle sculpted spherical keycap dish highlight on top
                    kCtx.fillStyle = topDishHex;
                    kCtx.beginPath();
                    kCtx.roundRect(10, 10, 108, 108, 18);
                    kCtx.fill();

                    // High-contrast crisp alphabet/character legend
                    kCtx.fillStyle = k.dark ? '#fff9ed' : '#26221e';
                    const fontSize = k.label.length > 3 ? 28 : (k.label.length > 1 ? 34 : 58);
                    kCtx.font = `800 ${fontSize}px "Inter", sans-serif`;
                    kCtx.textAlign = 'center';
                    kCtx.textBaseline = 'middle';
                    kCtx.fillText(k.label, 64, 66);

                    const topTex = new THREE.CanvasTexture(kCanvas);
                    topTex.anisotropy = 4;

                    const sideMat = new THREE.MeshStandardMaterial({
                        color: k.dark ? 0x696258 : 0xbdb2a0,
                        roughness: 0.5
                    });
                    const topMat = new THREE.MeshStandardMaterial({
                        map: topTex,
                        roughness: 0.38
                    });

                    // BoxGeometry with 6 face materials so +Y (index 2) gets the full crisp alphabet texture
                    const keyGeo = new THREE.BoxGeometry(kw, 0.16, kd);
                    const materials = [sideMat, sideMat, topMat, sideMat, sideMat, sideMat];

                    const keyMesh = new THREE.Mesh(keyGeo, materials);
                    keyMesh.position.set(curX + (k.w * unit) / 2, yBase, zPos);
                    keyMesh.rotation.x = 0.14;
                    keyMesh.castShadow = true;
                    keyMesh.receiveShadow = true;
                    keyMesh.userData.restY = yBase;
                    keyMesh.userData.keyLabel = k.label;
                    keyMesh.userData.keyCode = k.code;
                    keyMesh.userData.topMat = topMat;
                    kbGroup.add(keyMesh);

                    keyMeshesByCode[k.code] = keyMesh;

                    registerInteractable(keyMesh, `Key [${k.label}] (Click or Type)`, () => {
                        triggerKeyPress(k.code, k.label);
                    });

                    curX += k.w * unit;
                });
            });
        }

        // Handle 3D Key Depression + Real-time Typing on CRT Screen
        function triggerKeyPress(code, charLabel) {
            const pitch = 0.92 + Math.random() * 0.18;
            sfx.playKeystroke(pitch);

            const keyMesh = keyMeshesByCode[code] || Object.values(keyMeshesByCode)[Math.floor(Math.random() * 20)];
            if (keyMesh) {
                gsap.killTweensOf(keyMesh.position);
                gsap.to(keyMesh.position, {
                    y: keyMesh.userData.restY - 0.085,
                    duration: 0.045,
                    yoyo: true,
                    repeat: 1
                });
                // Brief tactile keycap highlight flash
                if (keyMesh.userData.topMat) {
                    keyMesh.userData.topMat.emissive = new THREE.Color(0x557722);
                    setTimeout(() => {
                        if (keyMesh.userData.topMat) keyMesh.userData.topMat.emissive.setHex(0x000000);
                    }, 110);
                }
            }

            // Spawn a floating heart on pixel cat screen when typing
            state.catHearts.push({ x: 130 + Math.random() * 250, y: 205, alpha: 0.85 });

            // Snake Game Controls via WASD / Arrows
            if (state.screenMode === 'game') {
                if (code === 'KeyW' || code === 'ArrowUp') state.snakeDir = { x: 0, y: -1 };
                if (code === 'KeyS' || code === 'ArrowDown') state.snakeDir = { x: 0, y: 1 };
                if (code === 'KeyA' || code === 'ArrowLeft') state.snakeDir = { x: -1, y: 0 };
                if (code === 'KeyD' || code === 'ArrowRight') state.snakeDir = { x: 1, y: 0 };
            }

            // 1. Update 'Type: ' real-time input underneath 'loading...' in Cat Mode
            if (code === 'Backspace' || charLabel === 'DEL') {
                state.catInputText = state.catInputText.slice(0, -1);
                if (state.typedText.length > 0) {
                    state.typedText = state.typedText.slice(0, -1);
                }
            } else if (code === 'Escape' || charLabel === 'ESC') {
                state.catInputText = '';
                state.typedText = '> ';
                showToast("Cleared 'Type:' screen input!");
            } else if (code === 'Enter' || charLabel === 'ENT') {
                sfx.playGameboyDing();
                state.catJumpOffset = 20;
                gsap.to(state, { catJumpOffset: 0, duration: 0.4, ease: "bounce.out" });
                state.typedText += '\n> ';
            } else if (code === 'Space' || charLabel === 'SPACE' || charLabel === 'SPC') {
                state.catInputText += ' ';
                state.typedText += ' ';
            } else if (charLabel && charLabel.length === 1) {
                state.catInputText += charLabel.toUpperCase();
                const lines = state.typedText.split('\n');
                const currentLine = lines[lines.length - 1];
                if (currentLine.length >= 26) {
                    state.typedText += '\n' + charLabel.toUpperCase();
                } else {
                    state.typedText += charLabel.toUpperCase();
                }
            }
        }

        // Physical Keyboard Listener
        window.addEventListener('keydown', (e) => {
            if (e.metaKey || e.ctrlKey) return;
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace'].includes(e.code)) {
                e.preventDefault();
            }
            const label = e.key.length === 1 ? e.key.toUpperCase() : e.code;
            triggerKeyPress(e.code, label);
        });

        function setScreenMode(mode) {
            state.screenMode = mode;
            sfx.playSwitch(true);
            ['cat', 'terminal', 'game'].forEach((m) => {
                const btn = document.getElementById(`mode-${m}`);
                if (btn) btn.classList.toggle('active', m === mode);
            });
            const titles = {
                cat: 'SUPER CAT OS v4.0',
                terminal: 'GAMEBOY WORDPAD',
                game: 'RETRO SNAKE 1994'
            };
            state.activeCartridgeTitle = titles[mode];
            showToast(`Switched CRT Screen to ${titles[mode]}`);
        }

        function cycleScreenMode() {
            const order = ['cat', 'terminal', 'game'];
            const next = order[(order.indexOf(state.screenMode) + 1) % order.length];
            setScreenMode(next);
        }

        function moveCamera(preset) {
            sfx.playSwitch(true);
            ['overview', 'monitor', 'keyboard', 'fanclock', 'arcade'].forEach((id) => {
                const btn = document.getElementById(`cam-${id}`);
                if (btn) btn.classList.toggle('active', id === preset);
            });
            const presets = {
                overview: { pos: { x: -7.2, y: 8.8, z: 13.2 }, target: { x: 0.3, y: 2.2, z: 0.5 } },
                monitor:  { pos: { x: -0.9, y: 3.9, z: 5.5 },  target: { x: -0.9, y: 3.5, z: 0.5 } },
                keyboard: { pos: { x: 1.3, y: 4.1, z: 6.8 },   target: { x: 0.9, y: 0.4, z: 3.4 } },
                fanclock: { pos: { x: 3.4, y: 3.4, z: 4.8 },   target: { x: 3.3, y: 1.6, z: -0.9 } },
                arcade:   { pos: { x: -4.2, y: 3.8, z: 7.8 },  target: { x: -2.2, y: 0.6, z: 3.2 } }
            };
            const p = presets[preset] || presets.overview;
            gsap.to(camera.position, { x: p.pos.x, y: p.pos.y, z: p.pos.z, duration: 1.1, ease: "power3.out" });
            gsap.to(controls.target, { x: p.target.x, y: p.target.y, z: p.target.z, duration: 1.1, ease: "power3.out" });
        }

        const mouse = new THREE.Vector2();
        const customCursor = document.getElementById('custom-cursor');
        const cursorArrow = document.getElementById('cursor-arrow');
        const cursorHand = document.getElementById('cursor-hand');
        let hoveredObj = null;
        let pointerDownPos = { x: 0, y: 0 };

        window.addEventListener('pointermove', (e) => {
            // Move custom SVG cursor smoothly
            if (customCursor) {
                customCursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
            }

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            const isOverUI = Boolean(e.target.closest('button'));

            raycaster.setFromCamera(mouse, camera);
            const hits = isOverUI ? [] : raycaster.intersectObjects(interactables, false);

            if (hits.length > 0 || isOverUI) {
                hoveredObj = hits.length > 0 ? hits[0].object : null;
                customCursor.classList.add('cursor-hover');
                cursorArrow.classList.add('hidden');
                cursorHand.classList.remove('hidden');
            } else {
                hoveredObj = null;
                customCursor.classList.remove('cursor-hover');
                cursorArrow.classList.remove('hidden');
                cursorHand.classList.add('hidden');
            }
        });

        window.addEventListener('pointerdown', (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
            if (customCursor) customCursor.classList.add('cursor-click');
        });

        window.addEventListener('pointerup', (e) => {
            if (customCursor) customCursor.classList.remove('cursor-click');
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            if (dist < 6 && hoveredObj && hoveredObj.userData.onClick) {
                hoveredObj.userData.onClick();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================================
        // 13. INITIALIZE SCENE & START ANIMATION LOOP
        // ============================================================================
        createEnvironment();
        createSuperGameboyPC();
        createMechanicalKeyboard();
        createDeskAccessories();

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            controls.update();

            // Smoothly Spin 12-Blade Desk Fan Rotor based on 4 Speed Settings (0=Off, 1=Low, 2=Med, 3=Turbo)
            if (fanBladesGroup && state.fanSpeed > 0) {
                const speeds = [0, 0.09, 0.20, 0.36];
                fanBladesGroup.rotation.z -= speeds[state.fanSpeed];
            }

            // Render dynamic CRT Canvas
            drawCRT(elapsed);

            renderer.render(scene, camera);
        }

        window.onload = function () {
            animate();
        };
    </script>
</body>
</html>
