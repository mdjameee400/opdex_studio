<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Grin Cat Live Canvas</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f59e0b;
      --body-color: #050507;
      --teeth-color: #ffffff;
      --accent-glow: #ffd166;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      cursor: crosshair;
      transition: background-color 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Optional Dot-Matrix Halftone Pattern across Full Screen */
    body.mode-halftone::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.22) 1.8px, transparent 1.8px);
      background-size: 16px 16px;
      pointer-events: none;
      z-index: 2;
    }

    /* Three.js WebGL Ambient Particles */
    #webgl-aura {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* 2D Interactive FX Canvas (Claw Slashes, Sonic Rings & Bite Sparks) */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 30;
    }

    /* Full-Bleed Stage Anchored to Bottom (No Box Container) */
    .full-stage {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      perspective: 1200px;
      overflow: hidden;
    }

    .character-rig {
      position: relative;
      z-index: 5;
      width: min(96vw, 94vh);
      height: min(96vw, 94vh);
      transform-origin: center bottom;
      will-change: transform;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #cat-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      transition: filter 0.3s ease;
    }

    body.mode-overdrive #cat-svg {
      filter: drop-shadow(0 0 28px var(--accent-glow)) drop-shadow(0 14px 32px rgba(0, 0, 0, 0.45));
    }

    /* Main Cat Silhouette & 4 Floating Whiskers */
    #cat-body-path,
    .whisker-wedge {
      fill: var(--body-color);
      transition: fill 0.35s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .whisker-wedge {
      cursor: pointer;
    }

    .whisker-wedge:hover {
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    /* Mouth Cavity Backing */
    #mouth-backing {
      fill: var(--body-color);
      transition: fill 0.35s ease;
    }

    /* 7 Individual Sharp Triangular Teeth */
    .tooth-shape {
      fill: var(--teeth-color);
      cursor: pointer;
      transition: fill 0.25s ease, transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      transform-box: fill-box;
      transform-origin: center center;
    }

    .tooth-shape:hover,
    .tooth-shape.tooth-active {
      fill: var(--accent-glow);
      filter: drop-shadow(0 0 12px var(--accent-glow));
      transform: scale(1.03);
    }

    #upper-jaw-group,
    #lower-jaw-group {
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Jaw Snap / Bite State */
    .jaw-bite #upper-jaw-group {
      transform: translateY(15px);
    }
    .jaw-bite #lower-jaw-group {
      transform: translateY(-15px);
    }

    /* Jaw Open / Laugh State */
    .jaw-open #upper-jaw-group {
      transform: translateY(-12px);
    }
    .jaw-open #lower-jaw-group {
      transform: translateY(14px);
    }

    @keyframes laugh-chatter {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    body.mode-chatter #upper-jaw-group {
      animation: laugh-chatter 0.24s infinite ease-in-out;
    }

    /* =====================================================================
       UNIQUE MORPHING 3x3 DOT-MATRIX GLYPH HAMBURGER LAUNCHER
       ===================================================================== */
    .glyph-launcher {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 100;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: #0c0c0e;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      display: grid;
      grid-template-columns: repeat(3, 6px);
      grid-template-rows: repeat(3, 6px);
      gap: 5px;
      align-content: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-radius 0.3s ease;
    }

    .glyph-launcher:hover {
      transform: scale(1.08);
    }

    .glyph-launcher.open {
      border-radius: 50%;
      transform: rotate(90deg) scale(1.05);
    }

    .glyph-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--teeth-color);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, background-color 0.25s ease;
    }

    .glyph-dot:nth-child(5) {
      background-color: var(--bg-color);
      box-shadow: 0 0 8px var(--bg-color);
    }

    .glyph-launcher:hover .glyph-dot:nth-child(2),
    .glyph-launcher:hover .glyph-dot:nth-child(4),
    .glyph-launcher:hover .glyph-dot:nth-child(6),
    .glyph-launcher:hover .glyph-dot:nth-child(8) {
      opacity: 0.35;
      transform: scale(0.75);
    }

    .glyph-launcher.open .glyph-dot:nth-child(2),
    .glyph-launcher.open .glyph-dot:nth-child(4),
    .glyph-launcher.open .glyph-dot:nth-child(6),
    .glyph-launcher.open .glyph-dot:nth-child(8) {
      opacity: 0;
      transform: scale(0);
    }

    .glyph-launcher.open .glyph-dot:nth-child(1) { transform: translate(3px, 3px); }
    .glyph-launcher.open .glyph-dot:nth-child(3) { transform: translate(-3px, 3px); }
    .glyph-launcher.open .glyph-dot:nth-child(7) { transform: translate(3px, -3px); }
    .glyph-launcher.open .glyph-dot:nth-child(9) { transform: translate(-3px, -3px); }

    /* =====================================================================
       CUSTOMIZER POD (Strictly 5 Curated Colors per Category + 4 Modes)
       ===================================================================== */
    .customizer-pod {
      position: fixed;
      top: 80px;
      right: 22px;
      z-index: 99;
      width: 244px;
      background: rgba(12, 12, 15, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.48);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-12px) scale(0.95);
      transform-origin: top right;
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .customizer-pod.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .swatch-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .color-swatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease;
    }

    .color-swatch:hover {
      transform: scale(1.12);
    }

    .color-swatch.selected {
      border-color: #ffffff;
      transform: scale(1.14);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.22);
    }

    .mode-chip {
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #a1a1aa;
    }

    .mode-chip:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    .mode-chip.selected {
      background: #ffffff;
      color: #0c0c0e;
      border-color: #ffffff;
    }
  </style>
</head>
<body class="mode-halftone">

  <!-- 1. Three.js WebGL Ambient Particles -->
  <canvas id="webgl-aura"></canvas>

  <!-- 2. 2D Interactive FX Canvas (Claw Slashes, Sonic Rings & Bite Sparks) -->
  <canvas id="fx-canvas"></canvas>

  <!-- 3. Unique 3x3 Dot-Matrix Glyph Hamburger Launcher -->
  <button type="button" class="glyph-launcher" id="glyph-hamburger" aria-label="Customize UI">
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
    <span class="glyph-dot"></span>
  </button>

  <!-- 4. Customizer Pod (Strictly 5 Curated Colors per Category + 4 Modes) -->
  <div class="customizer-pod" id="customizer-pod">
    <!-- BG Colors (5 Limit) -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] tracking-[0.14em] uppercase text-[#8a8a90] font-medium">BG</span>
        <span class="w-1.5 h-1.5 rounded-full bg-[#e93423]"></span>
      </div>
      <div class="swatch-row" id="bg-swatches">
        <button type="button" class="color-swatch" data-bg="#e93423" style="background: #e93423;" title="Original Vermilion Red"></button>
        <button type="button" class="color-swatch" data-bg="#14151a" style="background: #14151a;" title="Obsidian Dark"></button>
        <button type="button" class="color-swatch selected" data-bg="#f59e0b" style="background: #f59e0b;" title="Cyber Amber Gold"></button>
        <button type="button" class="color-swatch" data-bg="#6d28d9" style="background: #6d28d9;" title="Phantom Violet"></button>
        <button type="button" class="color-swatch" data-bg="#e5e0d5" style="background: #e5e0d5;" title="Warm Bone"></button>
      </div>
    </div>

    <!-- Teeth & Glow Colors (5 Limit) -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] tracking-[0.14em] uppercase text-[#8a8a90] font-medium">TEETH</span>
        <span class="w-1.5 h-1.5 rounded-full bg-white"></span>
      </div>
      <div class="swatch-row" id="teeth-swatches">
        <button type="button" class="color-swatch selected" data-teeth="#ffffff" data-glow="#ffd166" style="background: linear-gradient(135deg, #ffffff 55%, #ffd166 55%);" title="Pure Fang White"></button>
        <button type="button" class="color-swatch" data-teeth="#fde047" data-glow="#ff6b35" style="background: linear-gradient(135deg, #fde047 55%, #ff6b35 55%);" title="Solar Cyber Gold"></button>
        <button type="button" class="color-swatch" data-teeth="#32f078" data-glow="#10b981" style="background: linear-gradient(135deg, #32f078 55%, #10b981 55%);" title="Venom Acid Green"></button>
        <button type="button" class="color-swatch" data-teeth="#38bdf8" data-glow="#f43f5e" style="background: linear-gradient(135deg, #38bdf8 55%, #f43f5e 55%);" title="Electric Ice Cyan"></button>
        <button type="button" class="color-swatch" data-teeth="#ff4d4d" data-glow="#ffffff" style="background: linear-gradient(135deg, #ff4d4d 55%, #ffffff 55%);" title="Crimson Fang"></button>
      </div>
    </div>

    <!-- Silhouette / Body Colors (5 Limit) -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] tracking-[0.14em] uppercase text-[#8a8a90] font-medium">BODY</span>
        <span class="w-1.5 h-1.5 rounded-full bg-white/40"></span>
      </div>
      <div class="swatch-row" id="body-swatches">
        <button type="button" class="color-swatch selected" data-body="#050507" style="background: #050507;" title="Shadow Pitch Black"></button>
        <button type="button" class="color-swatch" data-body="#161329" style="background: #161329;" title="Midnight Abyss"></button>
        <button type="button" class="color-swatch" data-body="#230a0d" style="background: #230a0d;" title="Dark Oxide"></button>
        <button type="button" class="color-swatch" data-body="#1e242d" style="background: #1e242d;" title="Graphite Steel"></button>
        <button type="button" class="color-swatch" data-body="#091e1a" style="background: #091e1a;" title="Deep Forest"></button>
      </div>
    </div>

    <!-- Interactive FX Modes (4 Modes) -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] tracking-[0.14em] uppercase text-[#8a8a90] font-medium">MODE</span>
      </div>
      <div class="grid grid-cols-4 gap-2" id="mode-buttons">
        <!-- 1. Classic Grin + Bite Slash (Default) -->
        <button type="button" class="mode-chip" data-mode="classic" title="Classic Live Grin + Bite Slash">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 11c3 6 13 6 16 0Z"/>
          </svg>
        </button>
        <!-- 2. Laugh / Chatter Mode -->
        <button type="button" class="mode-chip" data-mode="chatter" title="Mischievous Chattering Laugh">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 10h18M6 14h12"/>
          </svg>
        </button>
        <!-- 3. Overdrive Aura -->
        <button type="button" class="mode-chip" data-mode="overdrive" title="Overdrive Demon Aura">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </button>
        <!-- 4. Dot-Matrix Halftone -->
        <button type="button" class="mode-chip selected" data-mode="halftone" title="Dot-Matrix Halftone Shader">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
            <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
            <circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

              <g id="lower-jaw-group">
              <path class="tooth-shape" data-tooth="1" d="M 331 539 L 329 541 L 329 542 L 327 544 L 327 545 L 325 547 L 325 548 L 323 550 L 319 557 L 316 560 L 316 561 L 314 563 L 310 570 L 307 573 L 307 574 L 304 577 L 302 581 L 298 585 L 296 589 L 293 592 L 293 593 L 291 595 L 291 597 L 294 600 L 298 608 L 301 611 L 301 612 L 305 617 L 306 620 L 308 622 L 310 626 L 317 633 L 317 634 L 318 634 L 323 639 L 324 639 L 356 670 L 357 670 L 363 675 L 365 675 L 364 670 L 361 665 L 361 663 L 357 655 L 356 650 L 354 647 L 354 645 L 353 644 L 353 642 L 352 641 L 352 639 L 350 635 L 350 632 L 349 631 L 349 628 L 348 627 L 348 624 L 347 623 L 347 620 L 346 619 L 346 616 L 345 615 L 345 611 L 344 610 L 343 601 L 342 600 L 342 594 L 341 593 L 340 583 L 339 582 L 339 576 L 338 575 L 338 569 L 337 568 L 337 562 L 336 561 L 336 555 L 335 554 L 334 541 L 333 539 Z" />

              </g>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. SYNTHESIZED WEB AUDIO ENGINE (7-Tooth Synth Plucks & Jaw Bite Chomp)
    // =========================================================================
    let audioCtx = null;

    function getAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    const TOOTH_NOTES = [261.63, 311.13, 349.23, 392.00, 466.16, 523.25, 622.25];

    function playToothNote(idx) {
      const ctx = getAudio();
      if (!ctx) return;
      const freq = TOOTH_NOTES[idx % TOOTH_NOTES.length];
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.02, ctx.currentTime + 0.14);
      gain.gain.setValueAtTime(0.16, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
    }

    function playBiteSnapSound() {
      const ctx = getAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(42, ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.24, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    }

    // =========================================================================
    // 2. THREE.JS WEBGL 3D PARTICLE FIELD
    // =========================================================================
    let webglMat = null;
    function initWebGL() {
      const canvas = document.getElementById('webgl-aura');
      if (!window.THREE || !canvas) return;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 10;

      const count = 75;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        pos[i] = (Math.random() - 0.5) * 18;
        pos[i + 1] = (Math.random() - 0.5) * 14;
        pos[i + 2] = (Math.random() - 0.5) * 6;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      webglMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.06,
        transparent: true,
        opacity: 0.22
      });

      const pts = new THREE.Points(geo, webglMat);
      scene.add(pts);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function loop() {
        requestAnimationFrame(loop);
        pts.rotation.y += 0.0012;
        pts.rotation.x += 0.0006;
        renderer.render(scene, camera);
      }
      loop();
    }

    // =========================================================================
    // 3. LIVE CURSOR TRACKING: 3D HEAD SWAY, 7-TOOTH GRIN & FLOATING WHISKERS
    // =========================================================================
    const rigEl = document.getElementById('character-rig');
    const mouthRig = document.getElementById('mouth-rig');
    const whiskers = document.querySelectorAll('.whisker-wedge');

    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;

    function updatePointer(clientX, clientY) {
      targetX = (clientX / window.innerWidth - 0.5) * 2;
      targetY = (clientY / window.innerHeight - 0.5) * 2;
    }

    window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    let breathPhase = 0;
    function animateCharacterPhysics() {
      curX += (targetX - curX) * 0.14;
      curY += (targetY - curY) * 0.14;
      breathPhase += 0.045;

      // 1. Full Character 3D Head Tilt & Sway from Neck Base
      const rotY = curX * 11;
      const rotX = -curY * 8;
      const skewX = curX * -2.5;
      rigEl.style.transform = `perspective(1100px) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg) skewX(${skewX.toFixed(2)}deg)`;

      // 2. Wide 7-Tooth Grin Tracks Cursor Inside the Black Head Silhouette
      const mx = curX * 24;
      const my = curY * 16 + Math.sin(breathPhase) * 2.5;
      const mRot = curX * 3.5;
      mouthRig.style.transform = `translate(${mx.toFixed(1)}px, ${my.toFixed(1)}px) rotate(${mRot.toFixed(2)}deg)`;

      // 3. 4 Floating Whisker Wedges Spring Inertia & Twitch
      whiskers.forEach((w, idx) => {
        const isLeft = w.dataset.side === 'left';
        const isTop = w.dataset.pos === 'top';
        const dir = isLeft ? -1 : 1;
        const twitch = Math.sin(breathPhase * 1.4 + idx) * 4;
        const wx = curX * -18 + dir * 4;
        const wy = curY * -12 + (isTop ? -2 : 2);
        const wRot = dir * (curY * 10) + twitch;
        w.style.transform = `translate(${wx.toFixed(1)}px, ${wy.toFixed(1)}px) rotate(${wRot.toFixed(1)}deg)`;
      });

      requestAnimationFrame(animateCharacterPhysics);
    }
    animateCharacterPhysics();

    // Interactive 7-Tooth Synth Pluck on Hover/Click
    document.querySelectorAll('.tooth-shape').forEach((tooth, idx) => {
      tooth.addEventListener('mouseenter', () => {
        playToothNote(idx);
      });
      tooth.addEventListener('click', (e) => {
        e.stopPropagation();
        playToothNote(idx);
        tooth.classList.add('tooth-active');
        setTimeout(() => tooth.classList.remove('tooth-active'), 260);
      });
    });

    // Whisker Click Laugh
    whiskers.forEach((w, idx) => {
      w.addEventListener('click', (e) => {
        e.stopPropagation();
        playToothNote(idx + 2);
        mouthRig.classList.add('jaw-open');
        setTimeout(() => mouthRig.classList.remove('jaw-open'), 280);
      });
    });

    // =========================================================================
    // 4. 2D INTERACTIVE FX: TRIPLE CLAW SLASHES, JAW BITE & SONIC RINGS
    // =========================================================================
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    const clawSlashes = [];
    const roarRings = [];

    function resizeFx() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    resizeFx();
    window.addEventListener('resize', resizeFx);

    function spawnClawSlash(x, y) {
      const st = getComputedStyle(document.documentElement);
      const col = st.getPropertyValue('--teeth-color').trim() || '#ffffff';
      for (let i = -1; i <= 1; i++) {
        const offset = i * 22;
        clawSlashes.push({
          x1: x - 65 + offset * 0.5,
          y1: y - 55 - offset * 0.5,
          x2: x + 65 + offset * 0.5,
          y2: y + 55 - offset * 0.5,
          progress: 0,
          alpha: 1.0,
          color: i === 0 ? '#050507' : col
        });
      }
      roarRings.push({ x, y, r: 16, maxR: 180, alpha: 0.85, color: col });
    }

    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#glyph-hamburger') || e.target.closest('#customizer-pod')) return;
      mouthRig.classList.add('jaw-bite');
      spawnClawSlash(e.clientX, e.clientY);
      playBiteSnapSound();
    });

    window.addEventListener('mouseup', () => {
      mouthRig.classList.remove('jaw-bite');
    });

    function renderFx() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

      for (let i = roarRings.length - 1; i >= 0; i--) {
        const rg = roarRings[i];
        rg.r += (rg.maxR - rg.r) * 0.15;
        rg.alpha *= 0.9;
        if (rg.alpha < 0.02) {
          roarRings.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.beginPath();
        fxCtx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
        fxCtx.strokeStyle = rg.color;
        fxCtx.globalAlpha = rg.alpha;
        fxCtx.lineWidth = 3;
        fxCtx.stroke();
        fxCtx.restore();
      }

      for (let i = clawSlashes.length - 1; i >= 0; i--) {
        const cs = clawSlashes[i];
        cs.progress = Math.min(1, cs.progress + 0.25);
        cs.alpha *= 0.91;
        if (cs.alpha < 0.03) {
          clawSlashes.splice(i, 1);
          continue;
        }
        const cx = cs.x1 + (cs.x2 - cs.x1) * cs.progress;
        const cy = cs.y1 + (cs.y2 - cs.y1) * cs.progress;

        fxCtx.save();
        fxCtx.globalAlpha = cs.alpha;
        fxCtx.strokeStyle = cs.color;
        fxCtx.shadowColor = cs.color;
        fxCtx.shadowBlur = 12;
        fxCtx.lineWidth = 4.5;
        fxCtx.lineCap = 'round';
        fxCtx.beginPath();
        fxCtx.moveTo(cs.x1, cs.y1);
        fxCtx.lineTo(cx, cy);
        fxCtx.stroke();
        fxCtx.restore();
      }

      requestAnimationFrame(renderFx);
    }
    renderFx();

    // =========================================================================
    // 5. UNIQUE 3x3 GLYPH HAMBURGER & 5-COLOR / 4-MODE CUSTOMIZER
    // =========================================================================
    const hamBtn = document.getElementById('glyph-hamburger');
    const podEl = document.getElementById('customizer-pod');

    hamBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = podEl.classList.toggle('active');
      hamBtn.classList.toggle('open', open);
      playToothNote(open ? 5 : 2);
    });

    document.addEventListener('click', (e) => {
      if (!podEl.contains(e.target) && !hamBtn.contains(e.target)) {
        podEl.classList.remove('active');
        hamBtn.classList.remove('open');
      }
    });

    // 1. BG Swatches (Limit 5)
    document.querySelectorAll('#bg-swatches .color-swatch').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#bg-swatches .color-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.documentElement.style.setProperty('--bg-color', btn.dataset.bg);
        playToothNote(3);
      });
    });

    // 2. Teeth Swatches (Limit 5)
    document.querySelectorAll('#teeth-swatches .color-swatch').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#teeth-swatches .color-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.documentElement.style.setProperty('--teeth-color', btn.dataset.teeth);
        document.documentElement.style.setProperty('--accent-glow', btn.dataset.glow);
        playToothNote(5);
      });
    });

    // 3. Body Silhouette Swatches (Limit 5)
    document.querySelectorAll('#body-swatches .color-swatch').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#body-swatches .color-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.documentElement.style.setProperty('--body-color', btn.dataset.body);
        playToothNote(1);
      });
    });

    // 4. Mode Buttons (Classic Grin, Laugh Chatter, Overdrive Aura, Dot-Matrix Halftone)
    document.querySelectorAll('#mode-buttons .mode-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#mode-buttons .mode-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        const mode = chip.dataset.mode;

        document.body.classList.remove('mode-chatter', 'mode-overdrive', 'mode-halftone');
        if (mode === 'chatter') {
          document.body.classList.add('mode-chatter');
        } else if (mode === 'overdrive') {
          document.body.classList.add('mode-overdrive');
        } else if (mode === 'halftone') {
          document.body.classList.add('mode-halftone');
        }
        playToothNote(6);
      });
    });

    window.onload = () => {
      initWebGL();
    };
  </script>
