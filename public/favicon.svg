<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer Isometric Hexagon -->
  <g stroke="#18181B" stroke-width="4.5" stroke-linejoin="round">
    <!-- Top Face (Sunshine Yellow) -->
    <path 
      d="M 60 12 L 102 36 L 60 60 L 18 36 Z" 
      fill="#FFE66D" 
    />

    <!-- Left Face (Pastel Coral) -->
    <path 
      d="M 18 36 L 60 60 L 60 108 L 18 84 Z" 
      fill="#FF6B6B" 
    />

    <!-- Right Face (Pastel Lavender) -->
    <path 
      d="M 60 60 L 102 36 L 102 84 L 60 108 Z" 
      fill="#A78BFA" 
    />
  </g>

  <!-- Inner Bevel Accent Lines -->
  <g stroke="#18181B" stroke-width="3" stroke-linecap="round">
    <path d="M 39 24 L 81 48" opacity="0.25" />
    <path d="M 39 48 L 39 96" opacity="0.25" />
    <path d="M 81 48 L 81 96" opacity="0.25" />
  </g>

  <!-- Central Optical Zero-G Aperture (The "O") -->
  <!-- Outer Aperture Ring Shadow -->
  <circle 
    cx="60" 
    cy="60" 
    r="23" 
    fill="#FAF5EB" 
    stroke="#18181B" 
    stroke-width="5" 
  />

  <!-- Subtle Inner Aperture Accent -->
  <circle 
    cx="60" 
    cy="60" 
    r="14" 
    fill="#18181B" 
    opacity="0.08" 
  />
  
  <circle 
    cx="60" 
    cy="60" 
    r="6" 
    fill="#18181B" 
  />
</svg>
