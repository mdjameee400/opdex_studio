    stroke="#6EE7B7" 
    stroke-width="8" 
    stroke-linecap="round"
  />
  <path 
    d="M 48 88 C 30 86 16 78 14 66 C 12 54 26 44 48 38 C 58 35 70 34 82 36" 
    stroke="#18181B" 
