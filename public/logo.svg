  <path 
    d="M 98 42 C 108 52 108 64 96 74 C 84 84 66 90 48 88" 
    stroke="#18181B" 
    stroke-width="12" 
    stroke-linecap="round"
  />
  <path 
    d="M 98 42 C 108 52 108 64 96 74 C 84 84 66 90 48 88" 
    stroke="#6EE7B7" 
    stroke-width="8" 
    stroke-linecap="round"
  />
  <path 
