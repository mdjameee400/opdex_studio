  />

  <!-- Isometric 3D Artifact Cube -->
  <!-- Left/Front Face (Pastel Coral) -->
  <polygon 
    points="32,45 60,60 60,94 32,78" 
    fill="#FF6B6B" 
    stroke="#18181B" 
    stroke-width="3.5" 
    stroke-linejoin="round"
  />
  
  <!-- Right/Side Face (Pastel Lavender) -->
